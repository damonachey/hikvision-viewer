<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cameras</title>
  <style>
    :root { color-scheme: dark; --bg: #111418; --card: #1b2026; --line: #2c333b; --text: #e8ebee; --muted: #98a2ad; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 20px; }
    #status { flex: 1; color: var(--muted); font-size: 13px; }
    label { color: var(--muted); font-size: 13px; }
    button, select { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    select { margin-left: 6px; padding: 8px; }
    summary { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    #camera-list { position: absolute; top: 100%; right: 0; z-index: 1; width: 240px; max-width: 100%; max-height: 60vh; margin-top: 4px; padding: 6px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    #camera-list label { display: flex; align-items: center; gap: 8px; padding: 6px; color: var(--text); font-size: 14px; cursor: pointer; }
    #camera-list .offline { margin-left: auto; color: var(--muted); font-size: 12px; }
    button:disabled { opacity: .6; cursor: default; }
    #error { margin-bottom: 16px; color: var(--bad); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
    .camera { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .frame { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; background: #000; color: var(--muted); font-size: 13px; text-align: center; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .frame.failed { color: var(--bad); }
    .caption { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; }
    .name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .time { flex: none; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Cameras</h1>
    <span id="status"></span>
    <label>Auto refresh
      <select id="interval">
        <option value="0">Off</option>
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
        <option value="30">30 seconds</option>
        <option value="60">1 minute</option>
        <option value="300">5 minutes</option>
      </select>
    </label>
    <details id="camera-menu">
      <summary>Cameras</summary>
      <div id="camera-list"></div>
    </details>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <div id="error" hidden></div>
  <main id="grid"></main>
  <template id="camera-template">
    <article class="camera">
      <a class="link" target="_blank" rel="noopener"><div class="frame"></div></a>
      <div class="caption"><span class="name"></span><span class="time"></span></div>
    </article>
  </template>

  <script>
    const grid = document.getElementById('grid');
    const statusText = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const refreshButton = document.getElementById('refresh');
    const intervalSelect = document.getElementById('interval');
    const template = document.getElementById('camera-template');
    const cameraMenu = document.getElementById('camera-menu');
    const cameraList = document.getElementById('camera-list');
    const INTERVAL_KEY = 'autoRefreshSeconds';
    const HIDDEN_KEY = 'hiddenCameras';
    const hiddenCameras = readHiddenCameras();
    let cameras = [];
    let autoRefreshTimer;

    // Saves the hidden cameras rather than the shown ones, so new cameras appear by default.
    function readHiddenCameras() {
      try {
        const saved = JSON.parse(localStorage.getItem(HIDDEN_KEY));
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function shownCameras() {
      return cameras.filter((camera) => !hiddenCameras.has(camera.id));
    }

    function updateStatus() {
      const shown = shownCameras();
      const loaded = shown.filter((camera) => camera.loaded).length;
      statusText.textContent = shown.length ? `${loaded} of ${shown.length} snapshots loaded` : 'No cameras selected';
    }

    function setCameraShown(camera, shown) {
      if (shown) hiddenCameras.delete(camera.id);
      else hiddenCameras.add(camera.id);
      try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenCameras])); } catch {}

      camera.card.hidden = !shown;
      if (!shown) return updateStatus();
      loadSnapshot(camera, camera.card).then(() => {
        if (!refreshButton.disabled) updateStatus();
      });
    }

    function addCameraOption(camera) {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !hiddenCameras.has(camera.id);
      checkbox.addEventListener('change', () => setCameraShown(camera, checkbox.checked));
      label.append(checkbox, camera.name);
      if (camera.online === false) {
        const offline = document.createElement('span');
        offline.className = 'offline';
        offline.textContent = 'offline';
        label.append(offline);
      }
      cameraList.append(label);
    }

    function loadSnapshot(camera, card) {
      const frame = card.querySelector('.frame');
      const url = `/api/cameras/${camera.id}/snapshot?t=${Date.now()}`;
      return new Promise((resolve) => {
        const image = new Image();
        image.alt = camera.name;
        image.onload = () => {
          frame.className = 'frame';
          frame.replaceChildren(image);
          card.querySelector('.link').href = url;
          card.querySelector('.time').textContent = new Date().toLocaleTimeString();
          camera.loaded = true;
          resolve();
        };
        image.onerror = () => {
          frame.className = 'frame failed';
          frame.textContent = camera.online === false ? 'Camera offline' : 'Snapshot failed';
          card.querySelector('.time').textContent = '';
          camera.loaded = false;
          resolve();
        };
        image.src = url;
      });
    }

    async function refreshSnapshots() {
      refreshButton.disabled = true;
      statusText.textContent = 'Loading snapshots…';
      await Promise.all(shownCameras().map((camera) => loadSnapshot(camera, camera.card)));
      updateStatus();
      refreshButton.disabled = false;
    }

    async function loadCameras() {
      refreshButton.disabled = true;
      errorBox.hidden = true;
      statusText.textContent = 'Finding cameras…';
      try {
        const res = await fetch('/api/cameras');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        cameras = data.cameras;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        statusText.textContent = '';
        refreshButton.disabled = false;
        return;
      }

      grid.replaceChildren();
      cameraList.replaceChildren();
      for (const camera of cameras) {
        const card = template.content.firstElementChild.cloneNode(true);
        card.querySelector('.name').textContent = camera.name;
        card.querySelector('.name').title = camera.name;
        card.querySelector('.frame').textContent = 'Loading…';
        card.hidden = hiddenCameras.has(camera.id);
        camera.card = card;
        grid.append(card);
        addCameraOption(camera);
      }
      await refreshSnapshots();
    }

    function refresh() {
      return cameras.length ? refreshSnapshots() : loadCameras();
    }

    function startAutoRefresh() {
      clearInterval(autoRefreshTimer);
      const seconds = Number(intervalSelect.value);
      if (!seconds) return;
      autoRefreshTimer = setInterval(() => {
        // Skip a cycle while the last one is loading or nobody is watching, to spare the NVR.
        if (!refreshButton.disabled && !document.hidden) refresh();
      }, seconds * 1000);
    }

    document.addEventListener('click', (event) => {
      if (!cameraMenu.contains(event.target)) cameraMenu.open = false;
    });
    refreshButton.addEventListener('click', refresh);
    intervalSelect.addEventListener('change', () => {
      try { localStorage.setItem(INTERVAL_KEY, intervalSelect.value); } catch {}
      startAutoRefresh();
    });

    try { intervalSelect.value = localStorage.getItem(INTERVAL_KEY) ?? '0'; } catch {}
    if (intervalSelect.selectedIndex === -1) intervalSelect.value = '0';
    startAutoRefresh();
    loadCameras();
  </script>
</body>
</html>
