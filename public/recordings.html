<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recordings</title>
  <style>
    :root { color-scheme: dark; --bg: #111418; --card: #1b2026; --line: #2c333b; --text: #e8ebee; --muted: #98a2ad; --dim: #59626c; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    nav { display: flex; align-items: baseline; gap: 16px; margin-right: auto; }
    h1 { margin: 0; font-size: 20px; }
    nav a { color: var(--muted); font-size: 20px; font-weight: 600; text-decoration: none; }
    nav a:hover { color: var(--text); }
    summary { display: flex; align-items: center; justify-content: center; width: 39px; height: 39px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    #camera-panel { position: absolute; top: 100%; right: 0; z-index: 1; width: 240px; max-width: 100%; max-height: 60vh; margin-top: 4px; padding: 6px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    #camera-panel hr { margin: 6px 0; border: 0; border-top: 1px solid var(--line); }
    #clear-cache { width: 100%; padding: 6px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    #clear-cache:hover:not(:disabled) { background: var(--line); }
    #clear-cache:disabled { color: var(--muted); cursor: default; }
    #camera-list label { display: flex; align-items: center; gap: 8px; padding: 6px; color: var(--text); font-size: 14px; cursor: pointer; }
    #camera-list .offline { margin-left: auto; color: var(--muted); font-size: 12px; }
    #picker { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .row button { min-width: 32px; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
    .row button.no-video { color: var(--dim); }
    .row button.has-video { color: var(--text); }
    .row button:hover { border-color: var(--line); color: var(--text); }
    .row button[aria-current="date"] { border-color: var(--muted); }
    .row button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
    .row button.no-video[aria-pressed="true"] { background: var(--dim); color: var(--text); }
    #years button { font-size: 20px; }
    #days button { padding: 4px 0; }
    #timeline { width: min(100%, 1116px); margin-top: 8px; --label-width: 96px; }
    #timeline-time { margin-bottom: 4px; font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; }
    #timeline-body { position: relative; padding-top: 18px; outline-offset: 4px; touch-action: none; cursor: ew-resize; user-select: none; }
    #timeline-scale { position: absolute; top: 0; right: 0; left: var(--label-width); height: 18px; color: var(--muted); font-size: 11px; }
    #timeline-scale span { position: absolute; transform: translateX(-50%); }
    .band-row { display: grid; grid-template-columns: var(--label-width) 1fr; align-items: center; margin-top: 2px; }
    .band-name { overflow: hidden; padding-right: 8px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .band { position: relative; height: 16px; overflow: hidden; border-radius: 3px; background: var(--card); }
    /* A short clip would otherwise be too thin to see on a whole-day scale. */
    .band div { position: absolute; top: 0; bottom: 0; min-width: 2px; background: var(--muted); }
    #playhead { position: absolute; top: 0; bottom: 0; left: calc(var(--label-width) + (100% - var(--label-width)) * var(--position, 0)); width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
    #playhead::before { content: ""; position: absolute; top: 8px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
    #transport { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin-top: 10px; }
    .transport-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    #transport button { min-width: 44px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
    #transport button:hover { border-color: var(--muted); }
    #transport svg { display: block; margin: 2px auto; }
    #transport button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
    #error { margin-top: 16px; color: var(--bad); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 452px), 1fr)); gap: 12px; margin-top: 16px; }
    .camera { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .frame { aspect-ratio: 16 / 9; background: #000; }
    .caption { padding: 8px 10px; }
    .name { display: block; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Live</a>
      <h1>Recordings</h1>
    </nav>
    <details id="camera-menu">
      <summary aria-label="Choose cameras" title="Choose cameras">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </summary>
      <div id="camera-panel">
        <div id="camera-list"></div>
        <hr>
        <button id="clear-cache" type="button">Clear cached queries</button>
      </div>
    </details>
  </header>
  <main>
    <div id="picker">
      <div id="years" class="row" role="group" aria-label="Year"></div>
      <div id="months" class="row" role="group" aria-label="Month"></div>
      <div id="days" class="row" role="group" aria-label="Day"></div>
      <div id="timeline">
        <div id="timeline-time" aria-hidden="true"></div>
        <div id="timeline-body" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="86399">
          <div id="timeline-scale" aria-hidden="true"></div>
          <div id="bands"></div>
          <div id="playhead"></div>
        </div>
        <div id="transport">
          <div class="transport-group" role="group" aria-label="Skip back">
            <button type="button" aria-label="Back 1 hour">&laquo; 1h</button>
            <button type="button" aria-label="Back 15 minutes">&laquo; 15m</button>
            <button type="button" aria-label="Back 5 minutes">&laquo; 5m</button>
            <button type="button" aria-label="Back 1 minute">&laquo; 1m</button>
          </div>
          <div class="transport-group" role="group" aria-label="Playback">
            <button type="button" aria-label="Play" title="Play">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3v18l15-9z"/></svg>
            </button>
            <button type="button" aria-label="Pause" title="Pause">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></svg>
            </button>
          </div>
          <div class="transport-group" role="group" aria-label="Skip forward">
            <button type="button" aria-label="Forward 1 minute">1m &raquo;</button>
            <button type="button" aria-label="Forward 5 minutes">5m &raquo;</button>
            <button type="button" aria-label="Forward 15 minutes">15m &raquo;</button>
            <button type="button" aria-label="Forward 1 hour">1h &raquo;</button>
          </div>
          <div id="speeds" class="transport-group" role="group" aria-label="Playback speed">
            <button type="button" data-speed="0.5" aria-label="Half speed">0.5x</button>
            <button type="button" data-speed="1" aria-label="Normal speed">1x</button>
            <button type="button" data-speed="2" aria-label="Double speed">2x</button>
          </div>
        </div>
      </div>
    </div>
    <div id="error" hidden></div>
    <div id="grid"></div>
  </main>
  <template id="camera-template">
    <article class="camera">
      <div class="frame"></div>
      <div class="caption"><span class="name"></span></div>
    </article>
  </template>

  <script>
    const now = new Date();
    const today = { year: now.getFullYear(), month: now.getMonth(), day: now.getDate() };
    const selected = { ...today };

    const YEARS_BACK = 10;
    const years = Array.from({ length: YEARS_BACK + 1 }, (_, index) => today.year - YEARS_BACK + index);
    const monthFormat = new Intl.DateTimeFormat(undefined, { month: 'short' });
    const months = Array.from({ length: 12 }, (_, month) => month);
    const days = Array.from({ length: 31 }, (_, index) => index + 1);

    function buildRow(rowId, values, field, label, onChange) {
      const buttons = new Map(values.map((value) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label(value);
        button.addEventListener('click', () => {
          const changed = selected[field] !== value;
          selected[field] = value;
          render();
          if (changed) onChange?.();
        });
        return [value, button];
      }));
      document.getElementById(rowId).append(...buttons.values());
      return buttons;
    }

    const yearButtons = buildRow('years', years, 'year', (year) => year, async () => {
      showWithVideo(monthButtons, []);
      showWithVideo(dayButtons, []);
      showBands({});
      await loadMonths();
      await loadDays();
      await loadBands();
    });
    const monthButtons = buildRow('months', months, 'month', (month) => monthFormat.format(new Date(2000, month, 1)), async () => {
      showWithVideo(dayButtons, []);
      showBands({});
      await loadDays();
      await loadBands();
    });
    const dayButtons = buildRow('days', days, 'day', (day) => day, () => {
      showBands({});
      loadBands();
    });

    function render() {
      const lastDay = new Date(selected.year, selected.month + 1, 0).getDate();
      // Going from Jan 31 to February lands on the last day of February.
      selected.day = Math.min(selected.day, lastDay);

      for (const [year, button] of yearButtons) {
        button.setAttribute('aria-pressed', year === selected.year);
      }
      for (const [month, button] of monthButtons) {
        button.setAttribute('aria-pressed', month === selected.month);
      }
      for (const [day, button] of dayButtons) {
        button.hidden = day > lastDay;
        button.setAttribute('aria-pressed', day === selected.day);
        const isToday = selected.year === today.year && selected.month === today.month && day === today.day;
        button.toggleAttribute('aria-current', isToday);
        if (isToday) button.setAttribute('aria-current', 'date');
      }
    }

    const HIDDEN_KEY = 'hiddenRecordingCameras';
    const VIDEO_ROWS_DELAY_MS = 300;
    const CLEARED_MESSAGE_MS = 2000;
    const clearCacheButton = document.getElementById('clear-cache');
    const clearCacheLabel = clearCacheButton.textContent;
    const cameraMenu = document.getElementById('camera-menu');
    const cameraList = document.getElementById('camera-list');
    const errorBox = document.getElementById('error');
    const hiddenCameras = readHiddenCameras();
    let cameras = [];
    const SECONDS_PER_DAY = 24 * 60 * 60;
    const SCALE_HOURS = [0, 3, 6, 9, 12, 15, 18, 21, 24];
    const bands = document.getElementById('bands');
    const timelineBody = document.getElementById('timeline-body');
    const timelineScale = document.getElementById('timeline-scale');
    const speedButtons = document.querySelectorAll('#speeds button');
    const latestRowRequest = {};
    let videoRowsTimer;
    let bandRecordings = {};
    let timelineSeconds = 0;

    // Saves the hidden cameras rather than the shown ones, so new cameras appear by default.
    function readHiddenCameras() {
      try {
        const saved = JSON.parse(localStorage.getItem(HIDDEN_KEY));
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function setCameraShown(camera, card, shown) {
      if (shown) hiddenCameras.delete(camera.id);
      else hiddenCameras.add(camera.id);
      try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenCameras])); } catch {}
      card.hidden = !shown;
      showBands(bandRecordings);
      // Wait in case more cameras are about to change, since each load searches every year and month.
      clearTimeout(videoRowsTimer);
      videoRowsTimer = setTimeout(loadVideoRows, VIDEO_ROWS_DELAY_MS);
    }

    function showWithVideo(buttons, valuesWithVideo) {
      for (const [value, button] of buttons) {
        const hasVideo = valuesWithVideo.includes(value);
        button.classList.toggle('has-video', hasVideo);
        button.classList.toggle('no-video', !hasVideo);
      }
    }

    function shownCameraIds() {
      return cameras.filter((camera) => !hiddenCameras.has(camera.id)).map((camera) => camera.id).join(',');
    }

    async function loadRow(row, url, show) {
      const request = (latestRowRequest[row] ?? 0) + 1;
      latestRowRequest[row] = request;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        // A newer load has started, so this answer is for the wrong cameras or year.
        if (request !== latestRowRequest[row]) return;
        errorBox.hidden = true;
        show(data);
      } catch (err) {
        if (request !== latestRowRequest[row]) return;
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    function loadYears() {
      return loadRow('years', `/api/recordings/years?cameras=${shownCameraIds()}`, (data) => showWithVideo(yearButtons, data.years));
    }

    // The API counts months from 1, and the month row from 0.
    function loadMonths() {
      return loadRow('months', `/api/recordings/months?cameras=${shownCameraIds()}&year=${selected.year}`, (data) => {
        showWithVideo(monthButtons, data.months.map((month) => month - 1));
      });
    }

    function loadDays() {
      return loadRow('days', `/api/recordings/days?cameras=${shownCameraIds()}&year=${selected.year}&month=${selected.month + 1}`, (data) => {
        showWithVideo(dayButtons, data.days);
      });
    }

    function loadBands() {
      const date = `year=${selected.year}&month=${selected.month + 1}&day=${selected.day}`;
      return loadRow('bands', `/api/recordings/list?cameras=${shownCameraIds()}&${date}`, (data) => showBands(data.cameras));
    }

    async function loadVideoRows() {
      await loadYears();
      await loadMonths();
      await loadDays();
      await loadBands();
    }

    function formatTime(seconds) {
      return [seconds / 3600, (seconds % 3600) / 60, seconds % 60]
        .map((part) => String(Math.floor(part)).padStart(2, '0'))
        .join(':');
    }

    function showBands(recordings) {
      bandRecordings = recordings;
      const shown = cameras.filter((camera) => !hiddenCameras.has(camera.id));
      bands.replaceChildren(...shown.map((camera) => {
        const row = document.createElement('div');
        row.className = 'band-row';
        const name = document.createElement('span');
        name.className = 'band-name';
        name.textContent = camera.name;
        name.title = camera.name;
        const band = document.createElement('div');
        band.className = 'band';
        band.append(...(recordings[camera.id] ?? []).map(({ start, end }) => {
          const clip = document.createElement('div');
          clip.style.left = `${(start / SECONDS_PER_DAY) * 100}%`;
          clip.style.width = `${((end - start) / SECONDS_PER_DAY) * 100}%`;
          clip.title = `${formatTime(start)} to ${formatTime(end)}`;
          return clip;
        }));
        row.append(name, band);
        return row;
      }));
    }

    function setTime(seconds) {
      timelineSeconds = Math.min(Math.max(Math.round(seconds), 0), SECONDS_PER_DAY - 1);
      const text = formatTime(timelineSeconds);
      timelineBody.style.setProperty('--position', timelineSeconds / SECONDS_PER_DAY);
      timelineBody.setAttribute('aria-valuenow', timelineSeconds);
      timelineBody.setAttribute('aria-valuetext', text);
      document.getElementById('timeline-time').textContent = text;
    }

    function setTimeFromPointer(event) {
      const { left, width } = timelineScale.getBoundingClientRect();
      setTime(((event.clientX - left) / width) * SECONDS_PER_DAY);
    }

    function setSpeed(speed) {
      for (const button of speedButtons) {
        button.setAttribute('aria-pressed', button.dataset.speed === speed);
      }
    }

    function moveTimeWithKeys(event) {
      const moves = {
        ArrowLeft: timelineSeconds - 60,
        ArrowRight: timelineSeconds + 60,
        ArrowDown: timelineSeconds - 60,
        ArrowUp: timelineSeconds + 60,
        PageDown: timelineSeconds - 3600,
        PageUp: timelineSeconds + 3600,
        Home: 0,
        End: SECONDS_PER_DAY - 1,
      };
      if (!Object.hasOwn(moves, event.key)) return;
      event.preventDefault();
      setTime(moves[event.key]);
    }

    function addCameraOption(camera, card) {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !hiddenCameras.has(camera.id);
      checkbox.addEventListener('change', () => setCameraShown(camera, card, checkbox.checked));
      label.append(checkbox, camera.name);
      if (camera.online === false) {
        const offline = document.createElement('span');
        offline.className = 'offline';
        offline.textContent = 'offline';
        label.append(offline);
      }
      cameraList.append(label);
    }

    async function loadCameras() {
      const grid = document.getElementById('grid');
      const template = document.getElementById('camera-template');
      try {
        const res = await fetch('/api/cameras');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        cameras = data.cameras;
        grid.replaceChildren(...cameras.map((camera) => {
          const card = template.content.firstElementChild.cloneNode(true);
          const name = card.querySelector('.name');
          name.textContent = camera.name;
          name.title = camera.name;
          card.hidden = hiddenCameras.has(camera.id);
          addCameraOption(camera, card);
          return card;
        }));
        await loadVideoRows();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    async function clearCache() {
      clearCacheButton.disabled = true;
      try {
        const res = await fetch('/api/cache', { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadVideoRows();
        clearCacheButton.textContent = 'Cleared';
        setTimeout(() => {
          clearCacheButton.textContent = clearCacheLabel;
          clearCacheButton.disabled = false;
        }, CLEARED_MESSAGE_MS);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        clearCacheButton.disabled = false;
      }
    }

    document.addEventListener('click', (event) => {
      if (!cameraMenu.contains(event.target)) cameraMenu.open = false;
    });
    clearCacheButton.addEventListener('click', clearCache);
    timelineScale.append(...SCALE_HOURS.map((hour) => {
      const label = document.createElement('span');
      label.textContent = hour;
      label.style.left = `${(hour / 24) * 100}%`;
      return label;
    }));
    timelineBody.addEventListener('pointerdown', (event) => {
      timelineBody.setPointerCapture(event.pointerId);
      setTimeFromPointer(event);
    });
    timelineBody.addEventListener('pointermove', (event) => {
      if (timelineBody.hasPointerCapture(event.pointerId)) setTimeFromPointer(event);
    });
    timelineBody.addEventListener('keydown', moveTimeWithKeys);
    for (const button of speedButtons) {
      button.addEventListener('click', () => setSpeed(button.dataset.speed));
    }
    setSpeed('1');
    setTime(0);

    showWithVideo(yearButtons, []);
    showWithVideo(monthButtons, []);
    showWithVideo(dayButtons, []);
    render();
    loadCameras();
  </script>
</body>
</html>
