<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cameras</title>
  <style>
    :root { color-scheme: dark; --bg: #111418; --card: #1b2026; --line: #2c333b; --text: #e8ebee; --muted: #98a2ad; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0 auto 0 0; font-size: 20px; }
    #status { margin-top: 16px; color: var(--muted); font-size: 13px; }
    label { color: var(--muted); font-size: 13px; }
    button, select { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    select { padding: 8px; }
    summary { display: flex; align-items: center; justify-content: center; width: 39px; height: 39px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    #camera-list { position: absolute; top: 100%; right: 0; z-index: 1; width: 240px; max-width: 100%; max-height: 60vh; margin-top: 4px; padding: 6px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    #camera-list label { display: flex; align-items: center; gap: 8px; padding: 6px; color: var(--text); font-size: 14px; cursor: pointer; }
    #camera-list .offline { margin-left: auto; color: var(--muted); font-size: 12px; }
    #error { margin-bottom: 16px; color: var(--bad); }
    #grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-content: start; gap: 12px; }
    .camera { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .link { display: block; width: 100%; padding: 0; border: 0; border-radius: 0; background: none; }
    .link:disabled { opacity: 1; }
    .frame { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; background: #000; color: var(--muted); font-size: 13px; text-align: center; }
    .frame img, .frame video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .frame.failed { color: var(--bad); }
    .caption { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
    .name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .time { flex: none; margin-left: auto; color: var(--muted); font-size: 13px; }
    #full-view { width: min(1600px, calc(100vw - 32px)); max-width: none; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
    #full-view::backdrop { background: rgba(0, 0, 0, .8); }
    .full-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 10px; }
    .full-header .name { margin-right: auto; }
    #full-frame { width: 100%; height: auto; max-height: calc(100vh - 110px); }
  </style>
</head>
<body>
  <header>
    <h1>Cameras</h1>
    <select id="interval" aria-label="Auto refresh">
      <option value="live">Live</option>
      <option value="1">1 second</option>
      <option value="5">5 seconds</option>
      <option value="30">30 seconds</option>
      <option value="60">60 seconds</option>
      <option value="0" selected>Off</option>
    </select>
    <button id="refresh" type="button">Refresh</button>
    <details id="camera-menu">
      <summary aria-label="Choose cameras" title="Choose cameras">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </summary>
      <div id="camera-list"></div>
    </details>
  </header>
  <div id="error" hidden></div>
  <main id="grid"></main>
  <footer id="status"></footer>
  <template id="camera-template">
    <article class="camera">
      <button class="link" type="button"><div class="frame"></div></button>
      <div class="caption">
        <span class="name"></span>
        <span class="time"></span>
      </div>
    </article>
  </template>
  <dialog id="full-view">
    <div class="full-header">
      <span id="full-name" class="name"></span>
      <select id="full-interval" aria-label="Refresh" autocomplete="off">
        <option value="live">Live</option>
        <option value="1">1 second</option>
        <option value="5">5 seconds</option>
        <option value="30">30 seconds</option>
        <option value="60">60 seconds</option>
        <option value="0" selected>Off</option>
      </select>
      <button id="full-close" type="button">Close</button>
    </div>
    <div id="full-frame" class="frame"></div>
  </dialog>

  <script>
    const grid = document.getElementById('grid');
    const statusText = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const refreshButton = document.getElementById('refresh');
    const intervalSelect = document.getElementById('interval');
    const template = document.getElementById('camera-template');
    const cameraMenu = document.getElementById('camera-menu');
    const cameraList = document.getElementById('camera-list');
    const fullView = document.getElementById('full-view');
    const fullFrame = document.getElementById('full-frame');
    const fullInterval = document.getElementById('full-interval');
    const INTERVAL_KEY = 'autoRefreshSeconds';
    const HIDDEN_KEY = 'hiddenCameras';
    const MIN_RETRY_MS = 1000;
    const MAX_RETRY_MS = 30000;
    // Allows for short network hiccups before skipping ahead to the newest video.
    const MAX_LAG_SECONDS = 3;
    // Removing video also removes frames up to the next keyframe, and keyframes can be
    // far apart, so keep plenty or the frames being played could be removed too.
    const KEEP_BEHIND_SECONDS = 30;
    const hiddenCameras = readHiddenCameras();
    const gridStreams = new Map();
    let cameras = [];
    let refreshing = false;
    let refreshQueued = false;
    let autoRefreshTimer;
    let fullCamera = null;
    let fullStream = null;
    let fullTimer;
    let fullLoadId = 0;
    let fullLoading = false;

    // Saves the hidden cameras rather than the shown ones, so new cameras appear by default.
    function readHiddenCameras() {
      try {
        const saved = JSON.parse(localStorage.getItem(HIDDEN_KEY));
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function shownCameras() {
      return cameras.filter((camera) => !hiddenCameras.has(camera.id));
    }

    function isLive() {
      return intervalSelect.value === 'live';
    }

    function updateStatus() {
      const shown = shownCameras();
      const loaded = shown.filter((camera) => camera.loaded).length;
      if (!shown.length) statusText.textContent = 'No cameras selected';
      else if (isLive()) statusText.textContent = `Live view of ${shown.length} cameras`;
      else statusText.textContent = `${loaded} of ${shown.length} snapshots loaded`;
    }

    function setCameraShown(camera, shown) {
      if (shown) hiddenCameras.delete(camera.id);
      else hiddenCameras.add(camera.id);
      try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenCameras])); } catch {}

      camera.card.hidden = !shown;
      if (isLive()) {
        if (shown) startGridStream(camera);
        else stopGridStream(camera);
        return updateStatus();
      }
      if (!shown) return updateStatus();
      loadSnapshot(camera, camera.card).then(() => {
        if (!refreshing) updateStatus();
      });
    }

    function addCameraOption(camera) {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !hiddenCameras.has(camera.id);
      checkbox.addEventListener('change', () => setCameraShown(camera, checkbox.checked));
      label.append(checkbox, camera.name);
      if (camera.online === false) {
        const offline = document.createElement('span');
        offline.className = 'offline';
        offline.textContent = 'offline';
        label.append(offline);
      }
      cameraList.append(label);
    }

    function loadSnapshot(camera, card) {
      const frame = card.querySelector('.frame');
      const url = `/api/cameras/${camera.id}/snapshot?t=${Date.now()}`;
      return new Promise((resolve) => {
        const image = new Image();
        image.alt = camera.name;
        image.onload = () => {
          // The tiles may have switched to live video while this was loading.
          if (isLive()) return resolve();
          frame.className = 'frame';
          frame.replaceChildren(image);
          card.querySelector('.time').textContent = new Date().toLocaleTimeString();
          camera.loaded = true;
          resolve();
        };
        image.onerror = () => {
          if (isLive()) return resolve();
          frame.className = 'frame failed';
          frame.textContent = camera.online === false ? 'Camera offline' : 'Snapshot failed';
          card.querySelector('.time').textContent = '';
          camera.loaded = false;
          resolve();
        };
        image.src = url;
      });
    }

    // Automatic refreshes pass quiet, so the status only changes when you ask for a refresh.
    async function refreshSnapshots({ quiet = false } = {}) {
      refreshing = true;
      if (!quiet) statusText.textContent = 'Loading snapshots…';
      await Promise.all(shownCameras().map((camera) => loadSnapshot(camera, camera.card)));
      if (!quiet && !refreshQueued) updateStatus();
      finishRefresh();
    }

    function finishRefresh() {
      refreshing = false;
      if (refreshQueued) {
        refreshQueued = false;
        refresh();
      } else {
        // If the cameras never loaded, Refresh stays available to try again.
        refreshButton.disabled = isLive() && cameras.length > 0;
      }
    }

    // Only one refresh runs at a time, so a click during an automatic one runs straight
    // after it. The button stays disabled until the refresh it asked for has finished.
    function requestRefresh() {
      refreshButton.disabled = true;
      if (!refreshing) return refresh();
      refreshQueued = true;
      statusText.textContent = 'Loading snapshots…';
    }

    // Plays one camera's stream in a frame and reconnects until stop() is called.
    function startStream(camera, frame, { quality, onPlayingChange = () => {} }) {
      const waitingText = camera.online === false ? 'Camera offline' : 'Reconnecting…';
      let socket, video, sourceBuffer, retryTimer;
      let queue = [];
      let stopped = false;
      let retryDelay = MIN_RETRY_MS;

      function clearVideo() {
        if (!video) return;
        URL.revokeObjectURL(video.src);
        video.removeAttribute('src');
        video.load();
        video = null;
        sourceBuffer = null;
        queue = [];
      }

      function showMessage(text, failed = false) {
        clearVideo();
        onPlayingChange(false);
        frame.className = failed ? 'frame failed' : 'frame';
        frame.textContent = text;
      }

      function appendNext() {
        if (!sourceBuffer || sourceBuffer.updating || !queue.length) return;
        try {
          sourceBuffer.appendBuffer(queue.shift());
        } catch {
          socket.close();
        }
      }

      function onBufferUpdated() {
        const { buffered } = sourceBuffer;
        if (buffered.length) {
          const start = buffered.start(0);
          const end = buffered.end(buffered.length - 1);
          if (video.currentTime < start || end - video.currentTime > MAX_LAG_SECONDS) {
            video.currentTime = Math.max(start, end - 0.2);
          }
          if (video.currentTime - start > KEEP_BEHIND_SECONDS * 2) {
            sourceBuffer.remove(start, video.currentTime - KEEP_BEHIND_SECONDS);
            return;
          }
        }
        appendNext();
      }

      function startVideo(codec) {
        const type = `video/mp4; codecs="${codec}"`;
        if (!window.MediaSource || !MediaSource.isTypeSupported(type)) {
          stopped = true;
          socket.close();
          showMessage("This browser can't play this video", true);
          return;
        }
        const mediaSource = new MediaSource();
        video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('aria-label', camera.name);
        video.src = URL.createObjectURL(mediaSource);
        video.addEventListener('playing', () => {
          if (stopped) return;
          retryDelay = MIN_RETRY_MS;
          onPlayingChange(true);
        });
        video.addEventListener('error', () => socket.close());
        mediaSource.addEventListener('sourceopen', () => {
          if (stopped) return;
          sourceBuffer = mediaSource.addSourceBuffer(type);
          sourceBuffer.addEventListener('updateend', onBufferUpdated);
          appendNext();
        }, { once: true });
        frame.className = 'frame';
        frame.replaceChildren(video);
        // Autoplay alone can wait forever, because a live buffer stays too short to trigger it.
        video.play().catch(() => {});
      }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let failed = false;
        socket = new WebSocket(`${protocol}//${location.host}/api/cameras/${camera.id}/live?stream=${quality}`);
        socket.binaryType = 'arraybuffer';
        socket.onmessage = ({ data }) => {
          if (stopped) return;
          if (typeof data !== 'string') {
            queue.push(data);
            appendNext();
            return;
          }
          const message = JSON.parse(data);
          if (message.type === 'init') startVideo(message.codec);
          else if (message.type === 'error' && message.fatal) {
            failed = true;
            showMessage(message.message, true);
          }
        };
        socket.onclose = () => {
          if (stopped || failed) return;
          showMessage(waitingText);
          retryTimer = setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, MAX_RETRY_MS);
        };
      }

      showMessage(camera.online === false ? 'Camera offline' : 'Connecting…');
      connect();

      return {
        stop() {
          stopped = true;
          clearTimeout(retryTimer);
          socket.close();
          clearVideo();
          frame.replaceChildren();
        },
      };
    }

    function startGridStream(camera) {
      stopGridStream(camera);
      if (document.hidden || fullCamera) return;
      const time = camera.card.querySelector('.time');
      gridStreams.set(camera.id, startStream(camera, camera.card.querySelector('.frame'), {
        quality: 'sub',
        onPlayingChange(playing) {
          time.textContent = playing ? 'Live' : '';
        },
      }));
    }

    function stopGridStream(camera) {
      gridStreams.get(camera.id)?.stop();
      gridStreams.delete(camera.id);
      camera.card.querySelector('.time').textContent = '';
    }

    function startLiveGrid() {
      for (const camera of shownCameras()) startGridStream(camera);
    }

    function stopLiveGrid() {
      for (const camera of cameras) stopGridStream(camera);
    }

    function applyInterval() {
      startAutoRefresh();
      if (!cameras.length) return;
      if (isLive()) {
        refreshQueued = false;
        refreshButton.disabled = true;
        startLiveGrid();
        updateStatus();
      } else if (gridStreams.size || refreshButton.disabled) {
        stopLiveGrid();
        for (const camera of shownCameras()) {
          const frame = camera.card.querySelector('.frame');
          frame.className = 'frame';
          frame.textContent = 'Loading…';
        }
        if (refreshing) refreshQueued = true;
        else refresh();
      }
    }

    function loadFullSnapshot() {
      if (fullLoading) return;
      fullLoading = true;
      const loadId = fullLoadId;
      const image = new Image();
      image.alt = fullCamera.name;
      const finish = (show) => {
        // The camera or refresh setting may have changed while this was loading.
        if (loadId !== fullLoadId) return;
        fullLoading = false;
        show();
      };
      image.onload = () => finish(() => {
        fullFrame.className = 'frame';
        fullFrame.replaceChildren(image);
      });
      image.onerror = () => finish(() => {
        fullFrame.className = 'frame failed';
        fullFrame.textContent = 'Snapshot failed';
      });
      image.src = `/api/cameras/${fullCamera.id}/snapshot?full=1&t=${Date.now()}`;
    }

    function stopFullView() {
      fullStream?.stop();
      fullStream = null;
      clearInterval(fullTimer);
      fullLoadId++;
      fullLoading = false;
    }

    function startFullView() {
      stopFullView();
      if (document.hidden) return;
      if (fullInterval.value === 'live') {
        fullStream = startStream(fullCamera, fullFrame, { quality: 'main' });
        return;
      }
      if (!fullFrame.querySelector('img')) {
        fullFrame.className = 'frame';
        fullFrame.textContent = 'Loading…';
      }
      loadFullSnapshot();
      const seconds = Number(fullInterval.value);
      if (seconds) fullTimer = setInterval(loadFullSnapshot, seconds * 1000);
    }

    function openFullView(camera) {
      fullCamera = camera;
      stopLiveGrid();
      document.getElementById('full-name').textContent = camera.name;
      fullInterval.value = intervalSelect.value;
      fullFrame.replaceChildren();
      fullView.showModal();
      startFullView();
    }

    async function loadCameras() {
      refreshing = true;
      errorBox.hidden = true;
      statusText.textContent = 'Finding cameras…';
      try {
        const res = await fetch('/api/cameras');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        cameras = data.cameras;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        statusText.textContent = '';
        finishRefresh();
        return;
      }

      grid.replaceChildren();
      cameraList.replaceChildren();
      for (const camera of cameras) {
        const card = template.content.firstElementChild.cloneNode(true);
        card.querySelector('.name').textContent = camera.name;
        card.querySelector('.name').title = camera.name;
        card.querySelector('.frame').textContent = 'Loading…';
        const link = card.querySelector('.link');
        link.disabled = camera.online === false;
        link.setAttribute('aria-label', `Open ${camera.name} full size`);
        link.addEventListener('click', () => openFullView(camera));
        card.hidden = hiddenCameras.has(camera.id);
        camera.card = card;
        grid.append(card);
        addCameraOption(camera);
      }
      if (isLive()) {
        startLiveGrid();
        updateStatus();
        finishRefresh();
      } else {
        await refreshSnapshots();
      }
    }

    function refresh() {
      return cameras.length ? refreshSnapshots() : loadCameras();
    }

    function startAutoRefresh() {
      clearInterval(autoRefreshTimer);
      const seconds = Number(intervalSelect.value);
      if (!seconds) return; // Off or Live
      autoRefreshTimer = setInterval(() => {
        // Skip a cycle while the last one is loading, nobody is watching, or live video
        // is open, to spare the NVR.
        if (refreshing || document.hidden || fullCamera) return;
        if (cameras.length) refreshSnapshots({ quiet: true });
        else loadCameras();
      }, seconds * 1000);
    }

    document.addEventListener('click', (event) => {
      if (!cameraMenu.contains(event.target)) cameraMenu.open = false;
    });
    document.addEventListener('visibilitychange', () => {
      if (fullCamera) startFullView();
      else if (isLive() && document.hidden) stopLiveGrid();
      else if (isLive()) startLiveGrid();
    });
    refreshButton.addEventListener('click', requestRefresh);
    intervalSelect.addEventListener('change', () => {
      try { localStorage.setItem(INTERVAL_KEY, intervalSelect.value); } catch {}
      applyInterval();
    });
    document.getElementById('full-close').addEventListener('click', () => fullView.close());
    fullView.addEventListener('click', (event) => {
      if (event.target === fullView) fullView.close();
    });
    // Applies only to this view: it isn't saved and doesn't change the main setting.
    fullInterval.addEventListener('change', startFullView);
    fullView.addEventListener('close', () => {
      stopFullView();
      fullCamera = null;
      if (isLive()) startLiveGrid();
      else if (!refreshing) refreshSnapshots({ quiet: true });
    });

    try { intervalSelect.value = localStorage.getItem(INTERVAL_KEY) ?? '0'; } catch {}
    if (intervalSelect.selectedIndex === -1) intervalSelect.value = '0';
    startAutoRefresh();
    loadCameras();
  </script>
</body>
</html>
