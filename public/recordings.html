<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recordings</title>
  <style>
    :root { color-scheme: dark; --bg: #111418; --card: #1b2026; --line: #2c333b; --text: #e8ebee; --muted: #98a2ad; --dim: #59626c; --current-clip: #4cd964; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    nav { display: flex; align-items: baseline; gap: 16px; margin-right: auto; }
    h1 { margin: 0; font-size: 20px; }
    nav a { color: var(--muted); font-size: 20px; font-weight: 600; text-decoration: none; }
    nav a:hover { color: var(--text); }
    summary { display: flex; align-items: center; justify-content: center; width: 39px; height: 39px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    #camera-panel { position: absolute; top: 100%; right: 0; z-index: 1; width: 240px; max-width: 100%; max-height: 60vh; margin-top: 4px; padding: 6px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    #camera-panel hr { margin: 6px 0; border: 0; border-top: 1px solid var(--line); }
    #camera-panel button { width: 100%; padding: 6px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    #camera-panel button:hover:not(:disabled) { background: var(--line); }
    #camera-panel button:disabled { color: var(--muted); cursor: default; }
    #camera-list label { display: flex; align-items: center; gap: 8px; padding: 6px; color: var(--text); font-size: 14px; cursor: pointer; }
    #camera-list .offline { margin-left: auto; color: var(--muted); font-size: 12px; }
    #picker { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .row button { min-width: 32px; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
    .row button.no-video { color: var(--dim); }
    .row button.has-video { color: var(--text); }
    .row button:hover { border-color: var(--line); color: var(--text); }
    .row button[aria-current="date"] { border-color: var(--muted); }
    .row button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
    .row button.no-video[aria-pressed="true"] { background: var(--dim); color: var(--text); }
    #years button { font-size: 20px; }
    #days button { padding: 4px 0; }
    #timeline { width: min(100%, 1116px); margin-top: 8px; --label-width: 96px; }
    #timeline-time { margin-bottom: 4px; font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; }
    #timeline-body { position: relative; padding-top: 18px; outline-offset: 4px; touch-action: none; cursor: ew-resize; user-select: none; }
    #timeline-scale { position: absolute; top: 0; right: 0; left: var(--label-width); height: 18px; color: var(--muted); font-size: 11px; }
    #timeline-scale span { position: absolute; transform: translateX(-50%); }
    .band-row { display: grid; grid-template-columns: var(--label-width) 1fr; align-items: center; margin-top: 2px; }
    .band-name { overflow: hidden; padding-right: 8px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .band { position: relative; height: 16px; overflow: hidden; border-radius: 3px; background: var(--card); }
    /* A short clip would otherwise be too thin to see on a whole-day scale. */
    .band div { position: absolute; top: 0; bottom: 0; min-width: 2px; background: var(--muted); }
    .band div.current { z-index: 1; background: var(--current-clip); }
    #playhead { position: absolute; top: 0; bottom: 0; left: calc(var(--label-width) + (100% - var(--label-width)) * var(--position, 0)); width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
    #playhead::before { content: ""; position: absolute; top: 8px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
    #cache-dialog { width: min(440px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
    #cache-dialog::backdrop { background: rgba(0, 0, 0, .7); }
    #cache-dialog h2 { margin: 0 0 12px; font-size: 16px; }
    #cache-dialog table { width: 100%; border-collapse: collapse; font-size: 14px; }
    #cache-dialog th, #cache-dialog td { padding: 4px 0; font-weight: 400; text-align: right; }
    #cache-dialog th:first-child, #cache-dialog td:first-child { text-align: left; }
    #cache-dialog thead th { color: var(--muted); font-size: 12px; }
    #cache-summary { margin: 0 0 12px; font-size: 14px; }
    #cache-summary div { display: flex; justify-content: space-between; padding: 2px 0; }
    #cache-summary .total { font-weight: 600; }
    #cache-days-title { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
    #cache-days { max-height: 50vh; overflow-y: auto; }
    #cache-close { display: block; margin: 12px 0 0 auto; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    #download-dialog { width: min(360px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
    #download-dialog::backdrop { background: rgba(0, 0, 0, .7); }
    #download-dialog h2 { margin: 0 0 12px; font-size: 16px; }
    #download-dialog label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
    #download-dialog input, #download-dialog select { height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
    #download-start { display: block; width: 100%; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .download-length { display: flex; gap: 8px; margin-top: 4px; }
    #download-amount { flex: 1; min-width: 0; }
    #download-summary { min-height: 40px; margin: 0 0 12px; font-size: 13px; }
    #download-summary.failed { color: var(--bad); }
    .download-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .download-actions button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    .download-actions button:hover:not(:disabled) { border-color: var(--muted); }
    .download-actions button:disabled { color: var(--dim); cursor: default; }
    #error { margin-top: 16px; color: var(--bad); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 452px), 1fr)); gap: 12px; margin-top: 16px; }
    .camera { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .frame { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; background: #000; color: var(--muted); font-size: 13px; text-align: center; }
    .frame.failed { color: var(--bad); }
    .frame video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
    #thumbnail-status { min-height: 18px; margin-top: 4px; color: var(--muted); font-size: 12px; text-align: center; }
    .caption { display: flex; align-items: center; gap: 4px; padding: 8px 10px; }
    .name { display: block; overflow: hidden; margin-right: auto; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .caption button { display: flex; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
    .caption button:hover:not(:disabled) { border-color: var(--muted); }
    .caption button:disabled { color: var(--dim); cursor: default; }
    .tile-media { position: relative; }
    .tile-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; width: 100%; padding: 0; border: 0; background: rgba(0, 0, 0, .3); color: #fff; opacity: 0; cursor: pointer; }
    .tile-overlay:disabled { display: none; }
    .tile-media:hover .tile-overlay, .tile-overlay:focus-visible { opacity: 1; }
    /* Without a mouse there's no hover, so always show it. */
    @media (hover: none) { .tile-overlay { background: none; opacity: 1; } }
    .tile-overlay span { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(0, 0, 0, .65); }
    #full-view { width: min(1600px, calc(100vw - 32px)); max-width: none; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
    #full-view::backdrop { background: rgba(0, 0, 0, .8); }
    .full-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 10px; }
    .full-header button { display: flex; align-items: center; justify-content: center; min-width: 39px; height: 39px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    .full-header button:hover:not(:disabled) { border-color: var(--muted); }
    .full-header button:disabled { color: var(--dim); cursor: default; }
    #full-play, #full-download, #full-popout { padding: 0; }
    #full-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    #full-play .pause-icon, #full-play.playing .play-icon { display: none; }
    #full-play.playing .pause-icon { display: block; }
    #full-speed { height: 39px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    #full-speed:hover { border-color: var(--muted); }
    #full-frame { width: 100%; height: auto; max-height: calc(100vh - 150px); cursor: pointer; }
    #full-progress { display: flex; align-items: center; gap: 12px; padding: 8px 10px; }
    #full-seek { flex: 1; min-width: 0; margin: 0; accent-color: var(--current-clip); cursor: pointer; }
    #full-seek:disabled { cursor: default; }
    #full-elapsed { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    body.popout > header, body.popout #picker, body.popout #grid, body.popout #full-popout, body.popout #full-close { display: none; }
    body.popout #full-view[open] { display: flex; flex-direction: column; width: 100vw; height: 100vh; max-height: none; margin: 0; border: 0; border-radius: 0; }
    body.popout #full-frame { flex: 1; min-height: 0; aspect-ratio: auto; max-height: none; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Live</a>
      <h1>Recordings</h1>
    </nav>
    <details id="camera-menu">
      <summary aria-label="Choose cameras" title="Choose cameras">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </summary>
      <div id="camera-panel">
        <div id="camera-list"></div>
        <hr>
        <button id="clear-cache" type="button">Clear cached queries</button>
        <button id="clear-thumbnails" type="button">Clear cached thumbnails</button>
        <button id="cache-info" type="button">Cache info</button>
      </div>
    </details>
  </header>
  <main>
    <div id="picker">
      <div id="years" class="row" role="group" aria-label="Year"></div>
      <div id="months" class="row" role="group" aria-label="Month"></div>
      <div id="days" class="row" role="group" aria-label="Day"></div>
      <div id="timeline">
        <div id="timeline-time" aria-hidden="true"></div>
        <div id="timeline-body" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="86399">
          <div id="timeline-scale" aria-hidden="true"></div>
          <div id="bands"></div>
          <div id="playhead"></div>
        </div>
        <div id="thumbnail-status"></div>
      </div>
    </div>
    <div id="error" hidden></div>
    <div id="grid"></div>
  </main>
  <dialog id="cache-dialog" aria-labelledby="cache-title">
    <h2 id="cache-title">Cache info</h2>
    <div id="cache-summary"></div>
    <p id="cache-days-title">Thumbnails by day</p>
    <div id="cache-days"></div>
    <button id="cache-close" type="button">Close</button>
  </dialog>
  <template id="camera-template">
    <article class="camera">
      <div class="tile-media">
        <div class="frame"></div>
        <button class="tile-overlay" type="button" disabled>
          <span><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3v18l15-9z"/></svg></span>
        </button>
      </div>
      <div class="caption">
        <span class="name"></span>
        <button class="tile-popout" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6"/>
            <path d="M10 14 21 3"/>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <path d="M7 11v6l5-3z" fill="currentColor" stroke-width="1"/>
          </svg>
        </button>
      </div>
    </article>
  </template>
  <dialog id="full-view">
    <div class="full-header">
      <span id="full-name" class="name"></span>
      <span id="full-time"></span>
      <select id="full-speed" aria-label="Playback speed" title="Playback speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <button id="full-play" type="button">
        <svg class="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3v18l15-9z"/></svg>
        <svg class="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></svg>
      </button>
      <button id="full-download" type="button" aria-label="Download video" title="Download video">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="m7 10 5 5 5-5"/>
          <path d="M12 15V3"/>
        </svg>
      </button>
      <button id="full-popout" type="button" aria-label="Pop out to a new window" title="Pop out to a new window">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6"/>
          <path d="M10 14 21 3"/>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
      </button>
      <button id="full-close" type="button">Close</button>
    </div>
    <div id="full-frame" class="frame"></div>
    <div id="full-progress">
      <input id="full-seek" type="range" min="0" max="0" value="0" aria-label="Position in this clip" title="Position in this clip">
      <span id="full-elapsed"></span>
    </div>
  </dialog>
  <dialog id="download-dialog" aria-labelledby="download-title">
    <form method="dialog">
      <h2 id="download-title">Download video</h2>
      <label>Start time
        <input id="download-start" type="time" step="1" required>
      </label>
      <label>Length
        <div class="download-length">
          <input id="download-amount" type="number" min="1" step="1" value="1" required aria-label="Length">
          <select id="download-unit" aria-label="Length unit">
            <option value="60" selected>minutes</option>
            <option value="1">seconds</option>
          </select>
        </div>
      </label>
      <p id="download-summary"></p>
      <div class="download-actions">
        <button id="download-cancel" type="button">Cancel</button>
        <button id="download-save" type="submit">Download</button>
      </div>
    </form>
  </dialog>

  <script>
    const now = new Date();
    const today = { year: now.getFullYear(), month: now.getMonth(), day: now.getDate() };
    const selected = { ...today };

    const YEARS_BACK = 10;
    const years = Array.from({ length: YEARS_BACK + 1 }, (_, index) => today.year - YEARS_BACK + index);
    const monthFormat = new Intl.DateTimeFormat(undefined, { month: 'short' });
    const months = Array.from({ length: 12 }, (_, month) => month);
    const days = Array.from({ length: 31 }, (_, index) => index + 1);

    function buildRow(rowId, values, field, label, onChange) {
      const buttons = new Map(values.map((value) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label(value);
        button.addEventListener('click', () => {
          const changed = selected[field] !== value;
          selected[field] = value;
          render();
          if (changed) {
            thumbnailStarts = {};
            onChange?.();
          }
        });
        return [value, button];
      }));
      document.getElementById(rowId).append(...buttons.values());
      return buttons;
    }

    const yearButtons = buildRow('years', years, 'year', (year) => year, async () => {
      showWithVideo(monthButtons, []);
      showWithVideo(dayButtons, []);
      showBands({});
      await loadMonths();
      await loadDays();
      await loadBands();
    });
    const monthButtons = buildRow('months', months, 'month', (month) => monthFormat.format(new Date(2000, month, 1)), async () => {
      showWithVideo(dayButtons, []);
      showBands({});
      await loadDays();
      await loadBands();
    });
    const dayButtons = buildRow('days', days, 'day', (day) => day, () => {
      showBands({});
      loadBands();
    });

    function render() {
      const lastDay = new Date(selected.year, selected.month + 1, 0).getDate();
      // Going from Jan 31 to February lands on the last day of February.
      selected.day = Math.min(selected.day, lastDay);

      for (const [year, button] of yearButtons) {
        button.setAttribute('aria-pressed', year === selected.year);
      }
      for (const [month, button] of monthButtons) {
        button.setAttribute('aria-pressed', month === selected.month);
      }
      for (const [day, button] of dayButtons) {
        button.hidden = day > lastDay;
        button.setAttribute('aria-pressed', day === selected.day);
        const isToday = selected.year === today.year && selected.month === today.month && day === today.day;
        button.toggleAttribute('aria-current', isToday);
        if (isToday) button.setAttribute('aria-current', 'date');
      }
    }

    const HIDDEN_KEY = 'hiddenRecordingCameras';
    const VIDEO_ROWS_DELAY_MS = 300;
    const CLEARED_MESSAGE_MS = 2000;
    const SECONDS_PER_DAY = 24 * 60 * 60;
    const SCALE_HOURS = [0, 3, 6, 9, 12, 15, 18, 21, 24];
    const THUMBNAIL_POLL_MS = 2000;
    const THUMBNAIL_SECONDS = 5 * 60;
    const TICK_MS = 200;
    const GAP_TOLERANCE_SECONDS = 0.15;
    // More new video than this at once means the stream jumped over a gap.
    const MIN_GAP_SECONDS = 3;
    // Roughly how much of the next clip has arrived when a jump is noticed.
    const NEW_CLIP_SECONDS = 0.4;
    const QUIET_LIMIT_MS = 2000;
    const PLAY_RETRIES = 6;
    const PLAY_RETRY_MS = 500;
    const START_LIMIT_MS = 8000;
    // The search's clip times can be a few seconds off from the video itself, and a request
    // past a clip's real end would get the next clip's video.
    const CLIP_TIME_ERROR_SECONDS = 6;
    // Removing video also removes frames up to the next keyframe, so keep plenty behind.
    const KEEP_BEHIND_SECONDS = 30;
    // How far past the player a download may run before waiting for it to catch up.
    const READ_AHEAD_SECONDS = 60;

    const clearCacheButton = document.getElementById('clear-cache');
    const clearCacheLabel = clearCacheButton.textContent;
    const cameraMenu = document.getElementById('camera-menu');
    const cameraList = document.getElementById('camera-list');
    const errorBox = document.getElementById('error');
    const bands = document.getElementById('bands');
    const timelineBody = document.getElementById('timeline-body');
    const timelineScale = document.getElementById('timeline-scale');
    const fullView = document.getElementById('full-view');
    const fullFrame = document.getElementById('full-frame');
    const fullPlay = document.getElementById('full-play');
    const fullSpeed = document.getElementById('full-speed');
    const fullSeek = document.getElementById('full-seek');
    const downloadDialog = document.getElementById('download-dialog');
    const downloadStart = document.getElementById('download-start');
    const downloadAmount = document.getElementById('download-amount');
    const downloadUnit = document.getElementById('download-unit');
    const pageParams = new URLSearchParams(location.search);
    const popoutCameraId = pageParams.get('camera');

    const hiddenCameras = readHiddenCameras();
    const latestRowRequest = {};
    let cameras = [];
    let playback = null;
    let fullCamera = null;
    let playbackSpeed = 1;
    let seeking = false;
    let thumbnailStarts = {};
    let thumbnailsBuilding = false;
    let thumbnailTimer;
    let videoRowsTimer;
    let bandRecordings = {};
    let timelineSeconds = 0;

    // Saves the hidden cameras rather than the shown ones, so new cameras appear by default.
    function readHiddenCameras() {
      try {
        const saved = JSON.parse(localStorage.getItem(HIDDEN_KEY));
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function setCameraShown(camera, card, shown) {
      if (shown) hiddenCameras.delete(camera.id);
      else hiddenCameras.add(camera.id);
      try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenCameras])); } catch {}
      card.hidden = !shown;
      showBands(bandRecordings);
      // Wait in case more cameras are about to change, since each load searches every year and month.
      clearTimeout(videoRowsTimer);
      videoRowsTimer = setTimeout(loadVideoRows, VIDEO_ROWS_DELAY_MS);
    }

    function showWithVideo(buttons, valuesWithVideo) {
      for (const [value, button] of buttons) {
        const hasVideo = valuesWithVideo.includes(value);
        button.classList.toggle('has-video', hasVideo);
        button.classList.toggle('no-video', !hasVideo);
      }
    }

    function shownCameras() {
      return cameras.filter((camera) => !hiddenCameras.has(camera.id));
    }

    function shownCameraIds() {
      return shownCameras().map((camera) => camera.id).join(',');
    }

    async function loadRow(row, url, show) {
      const request = (latestRowRequest[row] ?? 0) + 1;
      latestRowRequest[row] = request;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        // A newer load has started, so this answer is for the wrong cameras or year.
        if (request !== latestRowRequest[row]) return;
        errorBox.hidden = true;
        show(data);
      } catch (err) {
        if (request !== latestRowRequest[row]) return;
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    function loadYears() {
      return loadRow('years', `/api/recordings/years?cameras=${shownCameraIds()}`, (data) => showWithVideo(yearButtons, data.years));
    }

    // The API counts months from 1, and the month row from 0.
    function loadMonths() {
      return loadRow('months', `/api/recordings/months?cameras=${shownCameraIds()}&year=${selected.year}`, (data) => {
        showWithVideo(monthButtons, data.months.map((month) => month - 1));
      });
    }

    function loadDays() {
      return loadRow('days', `/api/recordings/days?cameras=${shownCameraIds()}&year=${selected.year}&month=${selected.month + 1}`, (data) => {
        showWithVideo(dayButtons, data.days);
      });
    }

    function loadBands() {
      const date = `year=${selected.year}&month=${selected.month + 1}&day=${selected.day}`;
      return loadRow('bands', `/api/recordings/list?cameras=${shownCameraIds()}&${date}`, (data) => {
        showBands(data.cameras);
        loadThumbnails().catch(showThumbnailError);
      });
    }

    async function loadVideoRows() {
      await loadYears();
      await loadMonths();
      await loadDays();
      await loadBands();
    }

    function formatTime(seconds) {
      return [seconds / 3600, (seconds % 3600) / 60, seconds % 60]
        .map((part) => String(Math.floor(part)).padStart(2, '0'))
        .join(':');
    }

    function showBands(recordings) {
      bandRecordings = recordings;
      bands.replaceChildren(...shownCameras().map((camera) => {
        const row = document.createElement('div');
        row.className = 'band-row';
        const name = document.createElement('span');
        name.className = 'band-name';
        name.textContent = camera.name;
        name.title = camera.name;
        const band = document.createElement('div');
        band.className = 'band';
        band.dataset.camera = camera.id;
        band.append(...(recordings[camera.id] ?? []).map(({ start, end }) => {
          const clip = document.createElement('div');
          clip.style.left = `${(start / SECONDS_PER_DAY) * 100}%`;
          clip.style.width = `${((end - start) / SECONDS_PER_DAY) * 100}%`;
          clip.title = `${formatTime(start)} to ${formatTime(end)}`;
          return clip;
        }));
        row.append(name, band);
        return row;
      }));
      markCurrentClips();
    }

    // The clip under the bar, or else the next one after it.
    function currentClipIndex(camera) {
      return (bandRecordings[camera.id] ?? []).findIndex(({ end }) => end > timelineSeconds);
    }

    // Turns each band's current clip green and shows its thumbnail. Playing is only allowed
    // for the cameras that have one.
    function markCurrentClips() {
      for (const camera of cameras) {
        const index = currentClipIndex(camera);
        const clips = bands.querySelector(`[data-camera="${camera.id}"]`);
        clips?.querySelector('.current')?.classList.remove('current');
        clips?.children[index]?.classList.add('current');
        if (camera.overlayButton) camera.overlayButton.disabled = index === -1;
        if (camera.popoutButton) camera.popoutButton.disabled = index === -1;
        showClipThumbnail(camera, bandRecordings[camera.id]?.[index]);
      }
    }

    function thumbnailFor(camera, clip) {
      const starts = thumbnailStarts[camera.id] ?? [];
      // While the day is building, the nearest so far is better than nothing.
      if (thumbnailsBuilding) {
        return starts.reduce((best, start) => (best === undefined || Math.abs(start - clip.start) < Math.abs(best - clip.start) ? start : best), undefined);
      }
      // A clip close after another one shares that clip's thumbnail.
      return starts.findLast((start) => start <= clip.start && clip.start - start < THUMBNAIL_SECONDS);
    }

    function showClipThumbnail(camera, clip) {
      if (!camera.frame) return;
      const start = clip && thumbnailFor(camera, clip);
      if (start === undefined) {
        camera.frame.replaceChildren();
        return;
      }
      const src = `/api/recordings/thumbnails/${camera.id}/${selectedDate()}/${formatTime(start).replaceAll(':', '')}.jpg`;
      let image = camera.frame.querySelector('img');
      if (!image) {
        image = document.createElement('img');
        image.alt = camera.name;
        camera.frame.replaceChildren(image);
      }
      if (image.getAttribute('src') !== src) image.src = src;
    }

    // Asks the server to build the day's thumbnails, then follows along as they appear.
    async function loadThumbnails() {
      clearTimeout(thumbnailTimer);
      const date = selectedDate();
      const query = `year=${selected.year}&month=${selected.month + 1}&day=${selected.day}`;
      await fetch(`/api/recordings/thumbnails?${query}`, { method: 'PUT' });
      await followThumbnails(date);
    }

    async function followThumbnails(date) {
      const ids = cameras.map(({ id }) => id).join(',');
      const res = await fetch(`/api/recordings/thumbnails?cameras=${ids}&date=${date}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      // The date may have changed while waiting.
      if (date !== selectedDate()) return;
      const { running, total, done, failed, error } = data.status;
      thumbnailStarts = data.cameras;
      thumbnailsBuilding = running && data.status.date === date;
      markCurrentClips();
      const status = document.getElementById('thumbnail-status');
      if (error) status.textContent = error;
      else if (running) status.textContent = total ? `Making thumbnails: ${done} of ${total}` : 'Making thumbnails…';
      else status.textContent = failed ? `${failed} thumbnails could not be made` : '';
      if (running) {
        thumbnailTimer = setTimeout(() => followThumbnails(date).catch(showThumbnailError), THUMBNAIL_POLL_MS);
      }
    }

    function showCleared(button, label) {
      button.textContent = 'Cleared';
      setTimeout(() => {
        button.textContent = label;
        button.disabled = false;
      }, CLEARED_MESSAGE_MS);
    }

    // The day being viewed starts building again straight away.
    async function clearThumbnails() {
      const button = document.getElementById('clear-thumbnails');
      const label = button.textContent;
      button.disabled = true;
      button.textContent = 'Clearing…';
      try {
        const res = await fetch('/api/recordings/thumbnails', { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.json()).error);
        thumbnailStarts = {};
        markCurrentClips();
        await loadThumbnails();
        showCleared(button, label);
      } catch (err) {
        showThumbnailError(err);
        button.textContent = label;
        button.disabled = false;
      }
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
      if (bytes < 1024 ** 3) return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
      return `${(bytes / 1024 ** 3).toFixed(1)} GB`;
    }

    function summaryRow(label, value, className = '') {
      const row = document.createElement('div');
      row.className = className;
      const name = document.createElement('span');
      name.textContent = label;
      const amount = document.createElement('span');
      amount.textContent = value;
      row.append(name, amount);
      return row;
    }

    function tableRow(cells, tag) {
      const row = document.createElement('tr');
      row.append(...cells.map((text) => {
        const cell = document.createElement(tag);
        cell.textContent = text;
        return cell;
      }));
      return row;
    }

    async function showCacheInfo() {
      const summary = document.getElementById('cache-summary');
      const list = document.getElementById('cache-days');
      summary.replaceChildren(summaryRow('Loading…', ''));
      list.replaceChildren();
      document.getElementById('cache-dialog').showModal();
      try {
        const res = await fetch('/api/cache');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const files = data.days.reduce((total, day) => total + day.files, 0);
        const bytes = data.days.reduce((total, day) => total + day.bytes, 0);
        summary.replaceChildren(
          summaryRow('Total', formatBytes(data.queryBytes + bytes), 'total'),
          summaryRow('Thumbnails', `${files.toLocaleString()} files, ${formatBytes(bytes)}`),
          summaryRow('Cached queries', formatBytes(data.queryBytes)),
          summaryRow('Free disk space', data.diskFreeBytes === null ? 'Unknown' : `${formatBytes(data.diskFreeBytes)} of ${formatBytes(data.diskTotalBytes)}`),
        );
        if (!data.days.length) {
          list.textContent = 'None';
          return;
        }
        const table = document.createElement('table');
        const head = document.createElement('thead');
        head.append(tableRow(['Day', 'Files', 'Size'], 'th'));
        const body = document.createElement('tbody');
        body.append(...data.days.map(({ date, files: dayFiles, bytes: dayBytes }) => tableRow([date, dayFiles.toLocaleString(), formatBytes(dayBytes)], 'td')));
        table.append(head, body);
        list.replaceChildren(table);
      } catch (err) {
        summary.replaceChildren(summaryRow(err.message, ''));
      }
    }

    function showThumbnailError(err) {
      document.getElementById('thumbnail-status').textContent = err.message;
    }

    function setTime(seconds) {
      timelineSeconds = Math.min(Math.max(Math.round(seconds), 0), SECONDS_PER_DAY - 1);
      const text = formatTime(timelineSeconds);
      timelineBody.style.setProperty('--position', timelineSeconds / SECONDS_PER_DAY);
      timelineBody.setAttribute('aria-valuenow', timelineSeconds);
      timelineBody.setAttribute('aria-valuetext', text);
      document.getElementById('timeline-time').textContent = text;
      document.getElementById('full-time').textContent = `${selectedDate()} ${text}`;
      markCurrentClips();
      if (!seeking) showProgress();
    }

    // The bar covers the clip being played, since a whole day would hardly move.
    function showProgress() {
      const clip = fullCamera && bandRecordings[fullCamera.id]?.[currentClipIndex(fullCamera)];
      fullSeek.disabled = !clip;
      document.getElementById('full-download').disabled = !clip;
      fullSeek.min = clip?.start ?? 0;
      fullSeek.max = clip?.end ?? 0;
      fullSeek.value = timelineSeconds;
      showElapsed(clip);
    }

    function showElapsed(clip) {
      const elapsed = clip ? Math.max(Number(fullSeek.value) - clip.start, 0) : 0;
      document.getElementById('full-elapsed').textContent = clip ? `${formatTime(elapsed)} / ${formatTime(clip.end - clip.start)}` : '';
    }

    function selectedDate() {
      return `${selected.year}-${String(selected.month + 1).padStart(2, '0')}-${String(selected.day).padStart(2, '0')}`;
    }

    function setTimeFromPointer(event) {
      const { left, width } = timelineScale.getBoundingClientRect();
      setTime(((event.clientX - left) / width) * SECONDS_PER_DAY);
    }

    function showPlayerMessage(text, isFailure = false) {
      fullFrame.className = isFailure ? 'frame failed' : 'frame';
      fullFrame.textContent = text;
    }

    function createPlayerVideo(camera, mediaSource) {
      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      // Setting the source resets playbackRate to this default.
      video.defaultPlaybackRate = playbackSpeed;
      video.setAttribute('aria-label', camera.name);
      video.src = URL.createObjectURL(mediaSource);
      return video;
    }

    // Plays one camera's recordings from a time of day until stop() or the stream goes quiet.
    function playRecording(camera, startSeconds, { keepFrame, onQuiet, onFailed }) {
      const start = `${selectedDate().replaceAll('-', '')}T${formatTime(startSeconds).replaceAll(':', '')}`;
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${protocol}//${location.host}/api/cameras/${camera.id}/recording?start=${start}`);
      const queue = [];
      const gaps = [];
      let video, sourceBuffer, tickTimer;
      let stopped = false;
      let failed = false;
      let bufferedEnd = 0;
      let lastPosition = 0;
      let quietSince = Date.now();

      function appendNext() {
        if (!sourceBuffer || sourceBuffer.updating || !queue.length) return;
        try {
          sourceBuffer.appendBuffer(queue.shift());
        } catch {
          socket.close();
        }
      }

      function onBufferUpdated() {
        // A new chunk may have started appending before this event arrived.
        if (sourceBuffer.updating) return;
        const { buffered } = sourceBuffer;
        if (buffered.length && video.currentTime - buffered.start(0) > KEEP_BEHIND_SECONDS * 2) {
          sourceBuffer.remove(buffered.start(0), video.currentTime - KEEP_BEHIND_SECONDS);
          return;
        }
        appendNext();
      }

      function startVideo(codec) {
        const type = `video/mp4; codecs="${codec}"`;
        if (!window.MediaSource || !MediaSource.isTypeSupported(type)) {
          failed = true;
          showPlayerMessage("This browser can't play this video", true);
          socket.close();
          return;
        }
        const mediaSource = new MediaSource();
        video = createPlayerVideo(camera, mediaSource);
        mediaSource.addEventListener('sourceopen', () => {
          URL.revokeObjectURL(video.src);
          if (stopped) return;
          sourceBuffer = mediaSource.addSourceBuffer(type);
          sourceBuffer.addEventListener('updateend', onBufferUpdated);
          appendNext();
        }, { once: true });
        fullFrame.className = 'frame';
        fullFrame.replaceChildren(video);
        video.play().catch(() => {});
        tickTimer = setInterval(tick, TICK_MS);
      }

      // The video's timestamps keep the real time between clips, and the browser holds the
      // last frame across each gap, so the player has to be moved past them. The NVR doesn't
      // always send the next clip, so a stream that goes quiet is handed back to the caller.
      function tick() {
        if (!sourceBuffer?.buffered.length) return;
        const { buffered } = sourceBuffer;
        const end = buffered.end(buffered.length - 1);
        if (end - bufferedEnd > MIN_GAP_SECONDS) gaps.push({ from: bufferedEnd, to: end - NEW_CLIP_SECONDS });
        bufferedEnd = end;

        const now = video.currentTime;
        const gap = gaps.find(({ from, to }) => now >= from - GAP_TOLERANCE_SECONDS && now < to);
        if (gap) video.currentTime = gap.to;
        else if (now < buffered.start(0)) video.currentTime = buffered.start(0);

        // The player can stop just short of the buffer's end, so watch for it not advancing.
        if (now !== lastPosition || gap) {
          lastPosition = now;
          quietSince = Date.now();
        } else if (Date.now() - quietSince > (now > 0 ? QUIET_LIMIT_MS : START_LIMIT_MS)) {
          return onQuiet(startSeconds + now);
        }
        setTime(startSeconds + video.currentTime);
      }

      socket.binaryType = 'arraybuffer';
      socket.onmessage = ({ data }) => {
        if (stopped) return;
        if (typeof data !== 'string') {
          queue.push(data);
          appendNext();
          return;
        }
        const message = JSON.parse(data);
        if (message.type === 'init') startVideo(message.codec);
        else if (message.type === 'error' && message.fatal) {
          failed = true;
          showPlayerMessage(message.message, true);
        }
      };
      // The NVR plays one recording at a time and can be slow to free up after the last one,
      // so a stream that never started is worth trying again unless the failure is permanent.
      socket.onclose = () => {
        if (stopped || video) return;
        onFailed(!failed);
      };
      if (!keepFrame) showPlayerMessage('Connecting…');

      return {
        setSpeed(speed) {
          if (video) video.playbackRate = speed;
        },
        stop() {
          stopped = true;
          clearInterval(tickTimer);
          socket.close();
          video?.pause();
        },
      };
    }

    // Plays faster than normal speed, one clip after another. The NVR only streams recordings
    // at normal speed, but its downloads arrive about 10 times faster and don't need its one
    // playback slot. Each clip's video is placed right after the last, so there are no gaps.
    function playDownloads(camera, startSeconds, { keepFrame, onEnded, onFailed }) {
      const aborter = new AbortController();
      const recordings = bandRecordings[camera.id] ?? [];
      const segments = [];
      let video, sourceBuffer, tickTimer;
      let allArrived = false;
      let lastPosition = 0;
      let quietSince = Date.now();

      const bufferEnd = () => (sourceBuffer.buffered.length ? sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1) : 0);
      const bufferUpdated = () => new Promise((resolve) => sourceBuffer.addEventListener('updateend', resolve, { once: true }));

      // Every other clip would fail the same way, so stop trying them.
      function giveUp(message) {
        showPlayerMessage(message, true);
        onFailed(false);
        throw new Error(message);
      }

      async function startVideo(codec) {
        const type = `video/mp4; codecs="${codec}"`;
        if (!window.MediaSource || !MediaSource.isTypeSupported(type)) giveUp("This browser can't play this video");
        const mediaSource = new MediaSource();
        video = createPlayerVideo(camera, mediaSource);
        // Reading up to a skipped time can take a while, so keep what's showing until then.
        video.addEventListener('loadeddata', () => {
          fullFrame.className = 'frame';
          fullFrame.replaceChildren(video);
        }, { once: true });
        await new Promise((resolve) => mediaSource.addEventListener('sourceopen', resolve, { once: true }));
        URL.revokeObjectURL(video.src);
        sourceBuffer = mediaSource.addSourceBuffer(type);
        video.play().catch(() => {});
        tickTimer = setInterval(tick, TICK_MS);
      }

      async function append(chunk) {
        // Wait here rather than holding the video in memory, which also slows the download.
        while (bufferEnd() - video.currentTime > READ_AHEAD_SECONDS) {
          await new Promise((resolve) => setTimeout(resolve, TICK_MS));
          if (aborter.signal.aborted) return;
        }
        const { buffered } = sourceBuffer;
        if (buffered.length && video.currentTime - buffered.start(0) > KEEP_BEHIND_SECONDS * 2) {
          sourceBuffer.remove(buffered.start(0), video.currentTime - KEEP_BEHIND_SECONDS);
          await bufferUpdated();
        }
        sourceBuffer.appendBuffer(chunk);
        await bufferUpdated();
      }

      async function playClip(clip, skip) {
        const url = `/api/recordings/clips/${camera.id}/${selectedDate()}/${clip.start}?skip=${skip}`;
        const res = await fetch(url, { signal: aborter.signal });
        if (res.status === 415) giveUp((await res.json()).error);
        if (!res.ok) throw new Error((await res.json()).error);
        if (!video) await startVideo(res.headers.get('X-Video-Codec'));
        // The last clip may have been cut off partway through a piece of video.
        sourceBuffer.abort();
        sourceBuffer.timestampOffset = bufferEnd();
        segments.push({ from: bufferEnd(), time: clip.start + skip });
        const reader = res.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) return;
          await append(value);
        }
      }

      async function playClips() {
        let error;
        const first = recordings.findIndex(({ end }) => end > startSeconds);
        for (const [index, clip] of recordings.entries()) {
          if (first === -1 || index < first) continue;
          try {
            await playClip(clip, index === first ? Math.max(startSeconds - clip.start, 0) : 0);
          } catch (err) {
            if (aborter.signal.aborted) return;
            error = err;
          }
        }
        allArrived = true;
        if (!video) {
          showPlayerMessage(error?.message ?? 'Could not play this camera', true);
          onFailed(false);
        }
      }

      function tick() {
        if (!sourceBuffer?.buffered.length) return;
        const { buffered } = sourceBuffer;
        const now = video.currentTime;
        // Skipped time can leave the first video just after where the player is waiting.
        for (let i = 0; i < buffered.length; i++) {
          if (now <= buffered.end(i)) {
            if (now < buffered.start(i)) video.currentTime = buffered.start(i);
            break;
          }
        }
        if (now !== lastPosition) {
          lastPosition = now;
          quietSince = Date.now();
        } else if (allArrived && Date.now() - quietSince > QUIET_LIMIT_MS) {
          return onEnded();
        }
        const segment = segments.findLast(({ from }) => from <= now);
        if (segment) setTime(segment.time + now - segment.from);
      }

      if (!keepFrame) showPlayerMessage('Connecting…');
      playClips();

      return {
        setSpeed(speed) {
          if (video) video.playbackRate = speed;
        },
        stop() {
          aborter.abort();
          clearInterval(tickTimer);
          video?.pause();
        },
      };
    }

    // Plays from the bar if it's inside the camera's green clip, or else from the next clip.
    function startPlayback(camera, keepFrame = false) {
      const recordings = bandRecordings[camera.id] ?? [];
      const index = currentClipIndex(camera);
      const clip = recordings[index];
      if (!clip) return;
      if (clip.start > timelineSeconds) return playFrom(camera, clip.start, keepFrame);
      if (clip.end - timelineSeconds > CLIP_TIME_ERROR_SECONDS) return playFrom(camera, timelineSeconds, keepFrame);
      // Too near the end to start safely, so use the next clip, or this one's start if it's last.
      playFrom(camera, (recordings[index + 1] ?? clip).start, keepFrame);
    }

    function playFrom(camera, seconds, keepFrame = false, attempt = 0) {
      stopPlayback();
      setTime(seconds);
      const play = playbackSpeed > 1 ? playDownloads : playRecording;
      playback = play(camera, Math.floor(seconds), {
        keepFrame: keepFrame || attempt > 0,
        onEnded: stopPlayback,
        onFailed: (canRetry) => {
          if (canRetry && attempt < PLAY_RETRIES) {
            playback.retryTimer = setTimeout(() => playFrom(camera, seconds, true, attempt + 1), PLAY_RETRY_MS * (attempt + 1));
            return;
          }
          if (canRetry && !fullFrame.querySelector('video')) {
            fullFrame.className = 'frame failed';
            fullFrame.textContent = 'Could not play this camera';
          }
          stopPlayback();
        },
        onQuiet: (position) => resumeAfterQuiet(camera, position),
      });
      showPlaybackState();
    }

    // Reconnects where the video should carry on, or stops if the day's video has run out.
    function resumeAfterQuiet(camera, position) {
      const recordings = bandRecordings[camera.id] ?? [];
      const stillInClip = recordings.some(({ start, end }) => start <= position && end - position > CLIP_TIME_ERROR_SECONDS);
      const next = recordings.find(({ start }) => start > position + 1);
      if (!stillInClip && !next) return stopPlayback();
      playFrom(camera, stillInClip ? position : next.start, true);
    }

    // The last frame stays on screen, so this also works as pause.
    function stopPlayback() {
      clearTimeout(playback?.retryTimer);
      playback?.stop();
      playback = null;
      showPlaybackState();
    }

    function showPlaybackState() {
      fullPlay.classList.toggle('playing', Boolean(playback));
      fullPlay.title = playback ? 'Pause' : 'Play';
      fullPlay.setAttribute('aria-label', fullPlay.title);
      fullPlay.disabled = !playback && (!fullCamera || currentClipIndex(fullCamera) === -1);
    }

    function openPlayer(camera) {
      fullCamera = camera;
      document.getElementById('full-name').textContent = camera.name;
      fullFrame.replaceChildren();
      showProgress();
      fullView.showModal();
      startPlayback(camera);
    }

    // The range the download popup describes, or null if its fields aren't filled in. It stops
    // at midnight, because the page only has one day's clips.
    function downloadRange() {
      const [hours, minutes, seconds = 0] = downloadStart.value.split(':').map(Number);
      const length = Number(downloadAmount.value) * Number(downloadUnit.value);
      if (!downloadStart.value || !Number.isInteger(length) || length < 1) return null;
      const start = hours * 3600 + minutes * 60 + seconds;
      return { start, length: Math.min(length, SECONDS_PER_DAY - start) };
    }

    // Time between clips isn't saved, so say how much video the range really holds.
    function showDownloadSummary() {
      const range = downloadRange();
      const clips = (range ? bandRecordings[fullCamera.id] ?? [] : []).filter(({ start, end }) => end > range.start && start < range.start + range.length);
      const recorded = clips.reduce((total, { start, end }) => total + Math.min(end, range.start + range.length) - Math.max(start, range.start), 0);
      const summary = document.getElementById('download-summary');
      summary.classList.toggle('failed', Boolean(range) && !clips.length);
      if (!range) summary.textContent = '';
      else if (!clips.length) summary.textContent = 'This range has no video.';
      else summary.textContent = `About ${formatTime(recorded)} of video from ${clips.length} ${clips.length === 1 ? 'clip' : 'clips'}, at full resolution. Time between clips is left out.`;
      document.getElementById('download-save').disabled = !clips.length;
    }

    function openDownloadDialog() {
      downloadStart.value = formatTime(timelineSeconds);
      showDownloadSummary();
      downloadDialog.showModal();
    }

    function saveDownload() {
      const { start, length } = downloadRange();
      const link = document.createElement('a');
      link.href = `/api/recordings/ranges/${fullCamera.id}/${selectedDate()}?start=${start}&seconds=${length}`;
      link.download = `${fullCamera.name} ${selectedDate()} ${formatTime(start).replaceAll(':', '-')} ${length}s.mp4`;
      link.click();
    }

    // Plays from the bar's time in its own window. It's the same window every time, because
    // the NVR plays one recording at a time.
    function popOut(camera) {
      const url = `/recordings?camera=${camera.id}&date=${selectedDate()}&time=${timelineSeconds}&speed=${playbackSpeed}`;
      const size = `left=0,top=0,width=${screen.availWidth},height=${screen.availHeight}`;
      const popup = window.open(url, 'recording', `popup,${size}`);
      popup?.focus();
      return popup;
    }

    // The page opened by a pop-out button: one camera filling the window, with no tiles.
    async function startPopout() {
      document.body.classList.add('popout');
      const [year, month, day] = (pageParams.get('date') ?? '').split('-').map(Number);
      selected.year = year;
      selected.month = month - 1;
      selected.day = day;
      // An unknown speed leaves the menu empty.
      fullSpeed.value = pageParams.get('speed');
      if (!fullSpeed.value) fullSpeed.value = '1';
      playbackSpeed = Number(fullSpeed.value);
      try {
        const camerasRes = await fetch('/api/cameras');
        const camerasData = await camerasRes.json();
        if (!camerasRes.ok) throw new Error(camerasData.error);
        const camera = camerasData.cameras.find(({ id }) => id === popoutCameraId);
        if (!camera) throw new Error(`Camera ${popoutCameraId} was not found`);
        const listRes = await fetch(`/api/recordings/list?cameras=${camera.id}&year=${year}&month=${month}&day=${day}`);
        const listData = await listRes.json();
        if (!listRes.ok) throw new Error(listData.error);
        bandRecordings = listData.cameras;
        document.title = camera.name;
        setTime(Number(pageParams.get('time')));
        openPlayer(camera);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    function moveTimeWithKeys(event) {
      const moves = {
        ArrowLeft: timelineSeconds - 60,
        ArrowRight: timelineSeconds + 60,
        ArrowDown: timelineSeconds - 60,
        ArrowUp: timelineSeconds + 60,
        PageDown: timelineSeconds - 3600,
        PageUp: timelineSeconds + 3600,
        Home: 0,
        End: SECONDS_PER_DAY - 1,
      };
      if (!Object.hasOwn(moves, event.key)) return;
      event.preventDefault();
      setTime(moves[event.key]);
    }

    function addCameraOption(camera, card) {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !hiddenCameras.has(camera.id);
      checkbox.addEventListener('change', () => setCameraShown(camera, card, checkbox.checked));
      label.append(checkbox, camera.name);
      if (camera.online === false) {
        const offline = document.createElement('span');
        offline.className = 'offline';
        offline.textContent = 'offline';
        label.append(offline);
      }
      cameraList.append(label);
    }

    async function loadCameras() {
      const grid = document.getElementById('grid');
      const template = document.getElementById('camera-template');
      try {
        const res = await fetch('/api/cameras');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        cameras = data.cameras;
        grid.replaceChildren(...cameras.map((camera) => {
          const card = template.content.firstElementChild.cloneNode(true);
          const name = card.querySelector('.name');
          name.textContent = camera.name;
          name.title = camera.name;
          camera.frame = card.querySelector('.frame');
          camera.overlayButton = card.querySelector('.tile-overlay');
          camera.overlayButton.title = `Play ${camera.name}`;
          camera.overlayButton.setAttribute('aria-label', camera.overlayButton.title);
          camera.overlayButton.addEventListener('click', () => openPlayer(camera));
          camera.popoutButton = card.querySelector('.tile-popout');
          camera.popoutButton.title = `Play ${camera.name} in a new window`;
          camera.popoutButton.setAttribute('aria-label', camera.popoutButton.title);
          camera.popoutButton.addEventListener('click', () => popOut(camera));
          card.hidden = hiddenCameras.has(camera.id);
          addCameraOption(camera, card);
          return card;
        }));
        await loadVideoRows();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    async function clearCache() {
      clearCacheButton.disabled = true;
      try {
        const res = await fetch('/api/cache', { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadVideoRows();
        showCleared(clearCacheButton, clearCacheLabel);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        clearCacheButton.disabled = false;
      }
    }

    document.addEventListener('click', (event) => {
      if (!cameraMenu.contains(event.target) && !document.getElementById('cache-dialog').open) cameraMenu.open = false;
    });
    clearCacheButton.addEventListener('click', clearCache);
    document.getElementById('clear-thumbnails').addEventListener('click', clearThumbnails);
    document.getElementById('cache-info').addEventListener('click', showCacheInfo);
    document.getElementById('cache-close').addEventListener('click', () => document.getElementById('cache-dialog').close());
    document.getElementById('cache-dialog').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) event.currentTarget.close();
    });
    fullPlay.addEventListener('click', () => {
      if (playback) stopPlayback();
      else startPlayback(fullCamera);
    });
    // Speeds above normal come from a different source, so crossing over has to reconnect.
    fullSpeed.addEventListener('change', () => {
      const wasFast = playbackSpeed > 1;
      playbackSpeed = Number(fullSpeed.value);
      if (!playback) return;
      if (wasFast === playbackSpeed > 1) playback.setSpeed(playbackSpeed);
      else startPlayback(fullCamera, true);
    });
    fullSeek.addEventListener('input', () => {
      seeking = true;
      showElapsed(bandRecordings[fullCamera.id]?.[currentClipIndex(fullCamera)]);
    });
    fullSeek.addEventListener('change', () => {
      seeking = false;
      setTime(Number(fullSeek.value));
      startPlayback(fullCamera, true);
    });
    fullFrame.addEventListener('click', () => fullPlay.click());
    document.getElementById('full-download').addEventListener('click', openDownloadDialog);
    for (const field of [downloadStart, downloadAmount, downloadUnit]) {
      field.addEventListener('input', showDownloadSummary);
    }
    downloadDialog.querySelector('form').addEventListener('submit', saveDownload);
    document.getElementById('download-cancel').addEventListener('click', () => downloadDialog.close());
    document.getElementById('full-close').addEventListener('click', () => fullView.close());
    document.getElementById('full-popout').addEventListener('click', () => {
      // Keep the view open if the browser blocked the new window.
      if (popOut(fullCamera)) fullView.close();
    });
    fullView.addEventListener('click', (event) => {
      if (event.target === fullView && !popoutCameraId) fullView.close();
    });
    // Esc closes the whole popped-out window. The browser can skip the cancel event, so
    // the close listener below handles this too.
    fullView.addEventListener('cancel', (event) => {
      if (!popoutCameraId) return;
      event.preventDefault();
      window.close();
    });
    fullView.addEventListener('close', () => {
      if (popoutCameraId) return window.close();
      fullCamera = null;
      stopPlayback();
      fullFrame.replaceChildren();
      fullFrame.className = 'frame';
    });
    timelineScale.append(...SCALE_HOURS.map((hour) => {
      const label = document.createElement('span');
      label.textContent = hour;
      label.style.left = `${(hour / 24) * 100}%`;
      return label;
    }));
    timelineBody.addEventListener('pointerdown', (event) => {
      timelineBody.setPointerCapture(event.pointerId);
      setTimeFromPointer(event);
    });
    timelineBody.addEventListener('pointermove', (event) => {
      if (timelineBody.hasPointerCapture(event.pointerId)) setTimeFromPointer(event);
    });
    timelineBody.addEventListener('keydown', moveTimeWithKeys);
    setTime(0);

    showWithVideo(yearButtons, []);
    showWithVideo(monthButtons, []);
    showWithVideo(dayButtons, []);
    render();
    if (popoutCameraId) startPopout();
    else loadCameras();
  </script>
</body>
</html>
