<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recordings</title>
  <style>
    :root { color-scheme: dark; --bg: #111418; --card: #1b2026; --line: #2c333b; --text: #e8ebee; --muted: #98a2ad; --dim: #59626c; --current-clip: #4cd964; --bad: #ff8a80; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    nav { display: flex; align-items: baseline; gap: 16px; margin-right: auto; }
    h1 { margin: 0; font-size: 20px; }
    nav a { color: var(--muted); font-size: 20px; font-weight: 600; text-decoration: none; }
    nav a:hover { color: var(--text); }
    summary { display: flex; align-items: center; justify-content: center; width: 39px; height: 39px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    #camera-panel { position: absolute; top: 100%; right: 0; z-index: 1; width: 240px; max-width: 100%; max-height: 60vh; margin-top: 4px; padding: 6px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    #camera-panel hr { margin: 6px 0; border: 0; border-top: 1px solid var(--line); }
    #camera-panel button { width: 100%; padding: 6px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    #camera-panel button:hover:not(:disabled) { background: var(--line); }
    #camera-panel button:disabled { color: var(--muted); cursor: default; }
    #camera-list label { display: flex; align-items: center; gap: 8px; padding: 6px; color: var(--text); font-size: 14px; cursor: pointer; }
    #camera-list .offline { margin-left: auto; color: var(--muted); font-size: 12px; }
    #picker { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .row button { min-width: 32px; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
    .row button.no-video { color: var(--dim); }
    .row button.has-video { color: var(--text); }
    .row button:hover { border-color: var(--line); color: var(--text); }
    .row button[aria-current="date"] { border-color: var(--muted); }
    .row button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
    .row button.no-video[aria-pressed="true"] { background: var(--dim); color: var(--text); }
    #years button { font-size: 20px; }
    #days button { padding: 4px 0; }
    #timeline { width: min(100%, 1116px); margin-top: 8px; --label-width: 96px; }
    #timeline-time { margin-bottom: 4px; font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; }
    #timeline-body { position: relative; padding-top: 18px; outline-offset: 4px; touch-action: none; cursor: ew-resize; user-select: none; }
    #timeline-scale { position: absolute; top: 0; right: 0; left: var(--label-width); height: 18px; color: var(--muted); font-size: 11px; }
    #timeline-scale span { position: absolute; transform: translateX(-50%); }
    .band-row { display: grid; grid-template-columns: var(--label-width) 1fr; align-items: center; margin-top: 2px; }
    .band-name { overflow: hidden; padding-right: 8px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .band { position: relative; height: 16px; overflow: hidden; border-radius: 3px; background: var(--card); }
    /* A short clip would otherwise be too thin to see on a whole-day scale. */
    .band div { position: absolute; top: 0; bottom: 0; min-width: 2px; background: var(--muted); }
    .band div.current { z-index: 1; background: var(--current-clip); }
    #playhead { position: absolute; top: 0; bottom: 0; left: calc(var(--label-width) + (100% - var(--label-width)) * var(--position, 0)); width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
    #playhead::before { content: ""; position: absolute; top: 8px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
    #transport { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin-top: 10px; }
    .transport-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    #transport button { min-width: 44px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
    #transport button:hover { border-color: var(--muted); }
    #error { margin-top: 16px; color: var(--bad); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 452px), 1fr)); gap: 12px; margin-top: 16px; }
    .camera { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .frame { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; background: #000; color: var(--muted); font-size: 13px; text-align: center; }
    .frame.failed { color: var(--bad); }
    .frame video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
    #thumbnail-status { min-height: 18px; margin-top: 4px; color: var(--muted); font-size: 12px; text-align: center; }
    .caption { display: flex; align-items: center; gap: 4px; padding: 8px 10px; }
    .name { display: block; overflow: hidden; margin-right: auto; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .caption button { display: flex; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
    .caption button:hover:not(:disabled) { border-color: var(--muted); }
    .caption button:disabled { color: var(--dim); cursor: default; }
    .tile-play .pause-icon, .tile-play.playing .play-icon { display: none; }
    .tile-play.playing .pause-icon { display: block; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Live</a>
      <h1>Recordings</h1>
    </nav>
    <details id="camera-menu">
      <summary aria-label="Choose cameras" title="Choose cameras">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </summary>
      <div id="camera-panel">
        <div id="camera-list"></div>
        <hr>
        <button id="clear-cache" type="button">Clear cached queries</button>
        <button id="clear-thumbnails" type="button">Clear thumbnails</button>
      </div>
    </details>
  </header>
  <main>
    <div id="picker">
      <div id="years" class="row" role="group" aria-label="Year"></div>
      <div id="months" class="row" role="group" aria-label="Month"></div>
      <div id="days" class="row" role="group" aria-label="Day"></div>
      <div id="timeline">
        <div id="timeline-time" aria-hidden="true"></div>
        <div id="timeline-body" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="86399">
          <div id="timeline-scale" aria-hidden="true"></div>
          <div id="bands"></div>
          <div id="playhead"></div>
        </div>
        <div id="thumbnail-status"></div>
        <div id="transport">
          <div class="transport-group" role="group" aria-label="Skip back">
            <button type="button" data-skip="-3600" aria-label="Back 1 hour">&laquo; 1h</button>
            <button type="button" data-skip="-900" aria-label="Back 15 minutes">&laquo; 15m</button>
            <button type="button" data-skip="-300" aria-label="Back 5 minutes">&laquo; 5m</button>
            <button type="button" data-skip="-60" aria-label="Back 1 minute">&laquo; 1m</button>
          </div>
          <div class="transport-group" role="group" aria-label="Skip forward">
            <button type="button" data-skip="60" aria-label="Forward 1 minute">1m &raquo;</button>
            <button type="button" data-skip="300" aria-label="Forward 5 minutes">5m &raquo;</button>
            <button type="button" data-skip="900" aria-label="Forward 15 minutes">15m &raquo;</button>
            <button type="button" data-skip="3600" aria-label="Forward 1 hour">1h &raquo;</button>
          </div>
        </div>
      </div>
    </div>
    <div id="error" hidden></div>
    <div id="grid"></div>
  </main>
  <template id="camera-template">
    <article class="camera">
      <div class="frame"></div>
      <div class="caption">
        <span class="name"></span>
        <button class="tile-play" type="button" disabled>
          <svg class="play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3v18l15-9z"/></svg>
          <svg class="pause-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></svg>
        </button>
      </div>
    </article>
  </template>

  <script>
    const now = new Date();
    const today = { year: now.getFullYear(), month: now.getMonth(), day: now.getDate() };
    const selected = { ...today };

    const YEARS_BACK = 10;
    const years = Array.from({ length: YEARS_BACK + 1 }, (_, index) => today.year - YEARS_BACK + index);
    const monthFormat = new Intl.DateTimeFormat(undefined, { month: 'short' });
    const months = Array.from({ length: 12 }, (_, month) => month);
    const days = Array.from({ length: 31 }, (_, index) => index + 1);

    function buildRow(rowId, values, field, label, onChange) {
      const buttons = new Map(values.map((value) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label(value);
        button.addEventListener('click', () => {
          const changed = selected[field] !== value;
          selected[field] = value;
          render();
          if (changed) {
            stopPlayback();
            thumbnailStarts = {};
            onChange?.();
          }
        });
        return [value, button];
      }));
      document.getElementById(rowId).append(...buttons.values());
      return buttons;
    }

    const yearButtons = buildRow('years', years, 'year', (year) => year, async () => {
      showWithVideo(monthButtons, []);
      showWithVideo(dayButtons, []);
      showBands({});
      await loadMonths();
      await loadDays();
      await loadBands();
    });
    const monthButtons = buildRow('months', months, 'month', (month) => monthFormat.format(new Date(2000, month, 1)), async () => {
      showWithVideo(dayButtons, []);
      showBands({});
      await loadDays();
      await loadBands();
    });
    const dayButtons = buildRow('days', days, 'day', (day) => day, () => {
      showBands({});
      loadBands();
    });

    function render() {
      const lastDay = new Date(selected.year, selected.month + 1, 0).getDate();
      // Going from Jan 31 to February lands on the last day of February.
      selected.day = Math.min(selected.day, lastDay);

      for (const [year, button] of yearButtons) {
        button.setAttribute('aria-pressed', year === selected.year);
      }
      for (const [month, button] of monthButtons) {
        button.setAttribute('aria-pressed', month === selected.month);
      }
      for (const [day, button] of dayButtons) {
        button.hidden = day > lastDay;
        button.setAttribute('aria-pressed', day === selected.day);
        const isToday = selected.year === today.year && selected.month === today.month && day === today.day;
        button.toggleAttribute('aria-current', isToday);
        if (isToday) button.setAttribute('aria-current', 'date');
      }
    }

    const HIDDEN_KEY = 'hiddenRecordingCameras';
    const VIDEO_ROWS_DELAY_MS = 300;
    const CLEARED_MESSAGE_MS = 2000;
    const clearCacheButton = document.getElementById('clear-cache');
    const clearCacheLabel = clearCacheButton.textContent;
    const cameraMenu = document.getElementById('camera-menu');
    const cameraList = document.getElementById('camera-list');
    const errorBox = document.getElementById('error');
    const hiddenCameras = readHiddenCameras();
    let cameras = [];
    const SECONDS_PER_DAY = 24 * 60 * 60;
    const SCALE_HOURS = [0, 3, 6, 9, 12, 15, 18, 21, 24];
    const bands = document.getElementById('bands');
    const timelineBody = document.getElementById('timeline-body');
    const timelineScale = document.getElementById('timeline-scale');
    const latestRowRequest = {};
    const TICK_MS = 200;
    const GAP_TOLERANCE_SECONDS = 0.15;
    // More new video than this at once means the stream jumped over a gap.
    const MIN_GAP_SECONDS = 3;
    // Roughly how much of the next clip has arrived when a jump is noticed.
    const NEW_CLIP_SECONDS = 0.4;
    const QUIET_LIMIT_MS = 2000;
    const START_LIMIT_MS = 8000;
    // The search's clip times can be a few seconds off from the video itself, and a request
    // past a clip's real end would get the next clip's video.
    const CLIP_TIME_ERROR_SECONDS = 6;
    // Removing video also removes frames up to the next keyframe, so keep plenty behind.
    const KEEP_BEHIND_SECONDS = 30;
    let playback = null;
    const THUMBNAIL_POLL_MS = 2000;
    const THUMBNAIL_SECONDS = 5 * 60;
    let videoCamera = null;
    let thumbnailStarts = {};
    let thumbnailsBuilding = false;
    let thumbnailTimer;
    let videoRowsTimer;
    let bandRecordings = {};
    let timelineSeconds = 0;

    // Saves the hidden cameras rather than the shown ones, so new cameras appear by default.
    function readHiddenCameras() {
      try {
        const saved = JSON.parse(localStorage.getItem(HIDDEN_KEY));
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function setCameraShown(camera, card, shown) {
      if (shown) hiddenCameras.delete(camera.id);
      else hiddenCameras.add(camera.id);
      try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenCameras])); } catch {}
      card.hidden = !shown;
      if (playback?.camera === camera) stopPlayback();
      showBands(bandRecordings);
      // Wait in case more cameras are about to change, since each load searches every year and month.
      clearTimeout(videoRowsTimer);
      videoRowsTimer = setTimeout(loadVideoRows, VIDEO_ROWS_DELAY_MS);
    }

    function showWithVideo(buttons, valuesWithVideo) {
      for (const [value, button] of buttons) {
        const hasVideo = valuesWithVideo.includes(value);
        button.classList.toggle('has-video', hasVideo);
        button.classList.toggle('no-video', !hasVideo);
      }
    }

    function shownCameraIds() {
      return cameras.filter((camera) => !hiddenCameras.has(camera.id)).map((camera) => camera.id).join(',');
    }

    async function loadRow(row, url, show) {
      const request = (latestRowRequest[row] ?? 0) + 1;
      latestRowRequest[row] = request;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        // A newer load has started, so this answer is for the wrong cameras or year.
        if (request !== latestRowRequest[row]) return;
        errorBox.hidden = true;
        show(data);
      } catch (err) {
        if (request !== latestRowRequest[row]) return;
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    function loadYears() {
      return loadRow('years', `/api/recordings/years?cameras=${shownCameraIds()}`, (data) => showWithVideo(yearButtons, data.years));
    }

    // The API counts months from 1, and the month row from 0.
    function loadMonths() {
      return loadRow('months', `/api/recordings/months?cameras=${shownCameraIds()}&year=${selected.year}`, (data) => {
        showWithVideo(monthButtons, data.months.map((month) => month - 1));
      });
    }

    function loadDays() {
      return loadRow('days', `/api/recordings/days?cameras=${shownCameraIds()}&year=${selected.year}&month=${selected.month + 1}`, (data) => {
        showWithVideo(dayButtons, data.days);
      });
    }

    function loadBands() {
      const date = `year=${selected.year}&month=${selected.month + 1}&day=${selected.day}`;
      return loadRow('bands', `/api/recordings/list?cameras=${shownCameraIds()}&${date}`, (data) => {
        showBands(data.cameras);
        loadThumbnails().catch(showThumbnailError);
      });
    }

    async function loadVideoRows() {
      await loadYears();
      await loadMonths();
      await loadDays();
      await loadBands();
    }

    function formatTime(seconds) {
      return [seconds / 3600, (seconds % 3600) / 60, seconds % 60]
        .map((part) => String(Math.floor(part)).padStart(2, '0'))
        .join(':');
    }

    function showBands(recordings) {
      bandRecordings = recordings;
      const shown = cameras.filter((camera) => !hiddenCameras.has(camera.id));
      bands.replaceChildren(...shown.map((camera) => {
        const row = document.createElement('div');
        row.className = 'band-row';
        const name = document.createElement('span');
        name.className = 'band-name';
        name.textContent = camera.name;
        name.title = camera.name;
        const band = document.createElement('div');
        band.className = 'band';
        band.dataset.camera = camera.id;
        band.append(...(recordings[camera.id] ?? []).map(({ start, end }) => {
          const clip = document.createElement('div');
          clip.style.left = `${(start / SECONDS_PER_DAY) * 100}%`;
          clip.style.width = `${((end - start) / SECONDS_PER_DAY) * 100}%`;
          clip.title = `${formatTime(start)} to ${formatTime(end)}`;
          return clip;
        }));
        row.append(name, band);
        return row;
      }));
      markCurrentClips();
    }

    // The clip under the bar, or else the next one after it.
    function currentClipIndex(camera) {
      return (bandRecordings[camera.id] ?? []).findIndex(({ end }) => end > timelineSeconds);
    }

    // Turns each band's current clip green and shows its thumbnail. Play is only allowed
    // for the cameras that have one.
    function markCurrentClips() {
      for (const camera of cameras) {
        const index = currentClipIndex(camera);
        const clips = bands.querySelector(`[data-camera="${camera.id}"]`);
        clips?.querySelector('.current')?.classList.remove('current');
        clips?.children[index]?.classList.add('current');
        if (camera.playButton) camera.playButton.disabled = index === -1;
        showClipThumbnail(camera, bandRecordings[camera.id]?.[index]);
      }
    }

    function thumbnailFor(camera, clip) {
      const starts = thumbnailStarts[camera.id] ?? [];
      // While the day is building, the nearest so far is better than nothing.
      if (thumbnailsBuilding) {
        return starts.reduce((best, start) => (best === undefined || Math.abs(start - clip.start) < Math.abs(best - clip.start) ? start : best), undefined);
      }
      // A clip close after another one shares that clip's thumbnail.
      return starts.findLast((start) => start <= clip.start && clip.start - start < THUMBNAIL_SECONDS);
    }

    function showClipThumbnail(camera, clip) {
      // This tile's video, playing or paused, stays until the bar is moved.
      if (!camera.frame || camera === videoCamera) return;
      const start = clip && thumbnailFor(camera, clip);
      if (start === undefined) {
        camera.frame.replaceChildren();
        return;
      }
      const src = `/api/recordings/thumbnails/${camera.id}/${selectedDate()}/${formatTime(start).replaceAll(':', '')}.jpg`;
      let image = camera.frame.querySelector('img');
      if (!image) {
        image = document.createElement('img');
        image.alt = camera.name;
        camera.frame.replaceChildren(image);
      }
      if (image.getAttribute('src') !== src) image.src = src;
    }

    // Asks the server to build the day's thumbnails, then follows along as they appear.
    async function loadThumbnails() {
      clearTimeout(thumbnailTimer);
      const date = selectedDate();
      const query = `year=${selected.year}&month=${selected.month + 1}&day=${selected.day}`;
      await fetch(`/api/recordings/thumbnails?${query}`, { method: 'PUT' });
      await followThumbnails(date);
    }

    async function followThumbnails(date) {
      const ids = cameras.map(({ id }) => id).join(',');
      const res = await fetch(`/api/recordings/thumbnails?cameras=${ids}&date=${date}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      // The date may have changed while waiting.
      if (date !== selectedDate()) return;
      const { running, total, done, failed, error } = data.status;
      thumbnailStarts = data.cameras;
      thumbnailsBuilding = running && data.status.date === date;
      markCurrentClips();
      const status = document.getElementById('thumbnail-status');
      if (error) status.textContent = error;
      else if (running) status.textContent = total ? `Making thumbnails: ${done} of ${total}` : 'Making thumbnails…';
      else status.textContent = failed ? `${failed} thumbnails could not be made` : '';
      if (running) {
        thumbnailTimer = setTimeout(() => followThumbnails(date).catch(showThumbnailError), THUMBNAIL_POLL_MS);
      }
    }

    // The day being viewed starts building again straight away.
    async function clearThumbnails() {
      const button = document.getElementById('clear-thumbnails');
      const label = button.textContent;
      button.disabled = true;
      button.textContent = 'Clearing…';
      try {
        const res = await fetch('/api/recordings/thumbnails', { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.json()).error);
        thumbnailStarts = {};
        markCurrentClips();
        await loadThumbnails();
        button.textContent = 'Cleared';
        setTimeout(() => {
          button.textContent = label;
          button.disabled = false;
        }, CLEARED_MESSAGE_MS);
      } catch (err) {
        showThumbnailError(err);
        button.textContent = label;
        button.disabled = false;
      }
    }

    function showThumbnailError(err) {
      document.getElementById('thumbnail-status').textContent = err.message;
    }

    function setTime(seconds) {
      timelineSeconds = Math.min(Math.max(Math.round(seconds), 0), SECONDS_PER_DAY - 1);
      const text = formatTime(timelineSeconds);
      timelineBody.style.setProperty('--position', timelineSeconds / SECONDS_PER_DAY);
      timelineBody.setAttribute('aria-valuenow', timelineSeconds);
      timelineBody.setAttribute('aria-valuetext', text);
      document.getElementById('timeline-time').textContent = text;
      markCurrentClips();
    }

    function selectedDate() {
      return `${selected.year}-${String(selected.month + 1).padStart(2, '0')}-${String(selected.day).padStart(2, '0')}`;
    }

    function setTimeFromPointer(event) {
      const { left, width } = timelineScale.getBoundingClientRect();
      setTime(((event.clientX - left) / width) * SECONDS_PER_DAY);
    }

    // Plays one camera's recordings from a time of day until stop() or the stream goes quiet.
    function playRecording(camera, startSeconds, { keepFrame, onQuiet, onFailed }) {
      const start = `${selectedDate().replaceAll('-', '')}T${formatTime(startSeconds).replaceAll(':', '')}`;
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${protocol}//${location.host}/api/cameras/${camera.id}/recording?start=${start}`);
      const queue = [];
      const gaps = [];
      const { frame } = camera;
      let video, sourceBuffer, tickTimer;
      let stopped = false;
      let failed = false;
      let bufferedEnd = 0;
      let lastPosition = 0;
      let quietSince = Date.now();

      function showMessage(text, isFailure = false) {
        frame.className = isFailure ? 'frame failed' : 'frame';
        frame.textContent = text;
      }

      function appendNext() {
        if (!sourceBuffer || sourceBuffer.updating || !queue.length) return;
        try {
          sourceBuffer.appendBuffer(queue.shift());
        } catch {
          socket.close();
        }
      }

      function onBufferUpdated() {
        // A new chunk may have started appending before this event arrived.
        if (sourceBuffer.updating) return;
        const { buffered } = sourceBuffer;
        if (buffered.length && video.currentTime - buffered.start(0) > KEEP_BEHIND_SECONDS * 2) {
          sourceBuffer.remove(buffered.start(0), video.currentTime - KEEP_BEHIND_SECONDS);
          return;
        }
        appendNext();
      }

      function startVideo(codec) {
        const type = `video/mp4; codecs="${codec}"`;
        if (!window.MediaSource || !MediaSource.isTypeSupported(type)) {
          failed = true;
          showMessage("This browser can't play this video", true);
          socket.close();
          return;
        }
        const mediaSource = new MediaSource();
        video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('aria-label', camera.name);
        video.src = URL.createObjectURL(mediaSource);
        mediaSource.addEventListener('sourceopen', () => {
          URL.revokeObjectURL(video.src);
          if (stopped) return;
          sourceBuffer = mediaSource.addSourceBuffer(type);
          sourceBuffer.addEventListener('updateend', onBufferUpdated);
          appendNext();
        }, { once: true });
        frame.className = 'frame';
        frame.replaceChildren(video);
        video.play().catch(() => {});
        tickTimer = setInterval(tick, TICK_MS);
      }

      // The video's timestamps keep the real time between clips, and the browser holds the
      // last frame across each gap, so the player has to be moved past them. The NVR doesn't
      // always send the next clip, so a stream that goes quiet is handed back to the caller.
      function tick() {
        if (!sourceBuffer?.buffered.length) return;
        const { buffered } = sourceBuffer;
        const end = buffered.end(buffered.length - 1);
        if (end - bufferedEnd > MIN_GAP_SECONDS) gaps.push({ from: bufferedEnd, to: end - NEW_CLIP_SECONDS });
        bufferedEnd = end;

        const now = video.currentTime;
        const gap = gaps.find(({ from, to }) => now >= from - GAP_TOLERANCE_SECONDS && now < to);
        if (gap) video.currentTime = gap.to;
        else if (now < buffered.start(0)) video.currentTime = buffered.start(0);

        // The player can stop just short of the buffer's end, so watch for it not advancing.
        if (now !== lastPosition || gap) {
          lastPosition = now;
          quietSince = Date.now();
        } else if (Date.now() - quietSince > (now > 0 ? QUIET_LIMIT_MS : START_LIMIT_MS)) {
          return onQuiet(startSeconds + now);
        }
        setTime(startSeconds + video.currentTime);
      }

      socket.binaryType = 'arraybuffer';
      socket.onmessage = ({ data }) => {
        if (stopped) return;
        if (typeof data !== 'string') {
          queue.push(data);
          appendNext();
          return;
        }
        const message = JSON.parse(data);
        if (message.type === 'init') startVideo(message.codec);
        else if (message.type === 'error' && message.fatal) {
          failed = true;
          showMessage(message.message, true);
        }
      };
      socket.onclose = () => {
        if (stopped || video) return;
        if (!failed) showMessage('Could not play this camera', true);
        onFailed();
      };
      if (!keepFrame) showMessage('Connecting…');

      return {
        camera,
        stop() {
          stopped = true;
          clearInterval(tickTimer);
          socket.close();
          video?.pause();
        },
      };
    }

    // Plays from the bar if it's inside the camera's green clip, or else from the next clip.
    function startPlayback(camera) {
      const recordings = bandRecordings[camera.id] ?? [];
      const index = currentClipIndex(camera);
      const clip = recordings[index];
      if (!clip) return;
      if (clip.start > timelineSeconds) return playFrom(camera, clip.start);
      if (clip.end - timelineSeconds > CLIP_TIME_ERROR_SECONDS) return playFrom(camera, timelineSeconds);
      // Too near the end to start safely, so use the next clip, or this one's start if it's last.
      playFrom(camera, (recordings[index + 1] ?? clip).start);
    }

    function playFrom(camera, seconds, keepFrame = false) {
      stopPlayback({ keepFrame });
      videoCamera = camera;
      setTime(seconds);
      playback = {
        camera,
        ...playRecording(camera, Math.floor(seconds), {
          keepFrame,
          onFailed: () => stopPlayback({ keepFrame: true }),
          onQuiet: (position) => resumeAfterQuiet(camera, position),
        }),
      };
      showPlaybackState();
    }

    // Reconnects where the video should carry on, or stops if the day's video has run out.
    function resumeAfterQuiet(camera, position) {
      const recordings = bandRecordings[camera.id] ?? [];
      const stillInClip = recordings.some(({ start, end }) => start <= position && end - position > CLIP_TIME_ERROR_SECONDS);
      const next = recordings.find(({ start }) => start > position + 1);
      if (!stillInClip && !next) return stopPlayback({ keepFrame: true });
      playFrom(camera, stillInClip ? position : next.start, true);
    }

    function stopPlayback({ keepFrame = false } = {}) {
      playback?.stop();
      playback = null;
      if (!keepFrame && videoCamera) {
        videoCamera.frame.replaceChildren();
        videoCamera.frame.className = 'frame';
        videoCamera = null;
        markCurrentClips();
      }
      showPlaybackState();
    }

    function showPlaybackState() {
      for (const camera of cameras) {
        if (!camera.playButton) continue;
        const isPlaying = playback?.camera === camera;
        camera.playButton.classList.toggle('playing', isPlaying);
        camera.playButton.title = `${isPlaying ? 'Pause' : 'Play'} ${camera.name}`;
        camera.playButton.setAttribute('aria-label', camera.playButton.title);
      }
    }

    function moveTimeWithKeys(event) {
      const moves = {
        ArrowLeft: timelineSeconds - 60,
        ArrowRight: timelineSeconds + 60,
        ArrowDown: timelineSeconds - 60,
        ArrowUp: timelineSeconds + 60,
        PageDown: timelineSeconds - 3600,
        PageUp: timelineSeconds + 3600,
        Home: 0,
        End: SECONDS_PER_DAY - 1,
      };
      if (!Object.hasOwn(moves, event.key)) return;
      event.preventDefault();
      stopPlayback();
      setTime(moves[event.key]);
    }

    function addCameraOption(camera, card) {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !hiddenCameras.has(camera.id);
      checkbox.addEventListener('change', () => setCameraShown(camera, card, checkbox.checked));
      label.append(checkbox, camera.name);
      if (camera.online === false) {
        const offline = document.createElement('span');
        offline.className = 'offline';
        offline.textContent = 'offline';
        label.append(offline);
      }
      cameraList.append(label);
    }

    async function loadCameras() {
      const grid = document.getElementById('grid');
      const template = document.getElementById('camera-template');
      try {
        const res = await fetch('/api/cameras');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        cameras = data.cameras;
        grid.replaceChildren(...cameras.map((camera) => {
          const card = template.content.firstElementChild.cloneNode(true);
          const name = card.querySelector('.name');
          name.textContent = camera.name;
          name.title = camera.name;
          camera.frame = card.querySelector('.frame');
          camera.playButton = card.querySelector('.tile-play');
          camera.playButton.addEventListener('click', () => {
            if (playback?.camera === camera) stopPlayback({ keepFrame: true });
            else startPlayback(camera);
          });
          card.hidden = hiddenCameras.has(camera.id);
          addCameraOption(camera, card);
          return card;
        }));
        showPlaybackState();
        await loadVideoRows();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    }

    async function clearCache() {
      clearCacheButton.disabled = true;
      try {
        const res = await fetch('/api/cache', { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadVideoRows();
        clearCacheButton.textContent = 'Cleared';
        setTimeout(() => {
          clearCacheButton.textContent = clearCacheLabel;
          clearCacheButton.disabled = false;
        }, CLEARED_MESSAGE_MS);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        clearCacheButton.disabled = false;
      }
    }

    document.addEventListener('click', (event) => {
      if (!cameraMenu.contains(event.target)) cameraMenu.open = false;
    });
    clearCacheButton.addEventListener('click', clearCache);
    document.getElementById('clear-thumbnails').addEventListener('click', clearThumbnails);
    timelineScale.append(...SCALE_HOURS.map((hour) => {
      const label = document.createElement('span');
      label.textContent = hour;
      label.style.left = `${(hour / 24) * 100}%`;
      return label;
    }));
    timelineBody.addEventListener('pointerdown', (event) => {
      stopPlayback();
      timelineBody.setPointerCapture(event.pointerId);
      setTimeFromPointer(event);
    });
    timelineBody.addEventListener('pointermove', (event) => {
      if (timelineBody.hasPointerCapture(event.pointerId)) setTimeFromPointer(event);
    });
    timelineBody.addEventListener('keydown', moveTimeWithKeys);
    for (const button of document.querySelectorAll('[data-skip]')) {
      button.addEventListener('click', () => {
        stopPlayback();
        setTime(timelineSeconds + Number(button.dataset.skip));
      });
    }
    setTime(0);

    showWithVideo(yearButtons, []);
    showWithVideo(monthButtons, []);
    showWithVideo(dayButtons, []);
    render();
    loadCameras();
  </script>
</body>
</html>
