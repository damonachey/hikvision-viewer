<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recordings</title>
  <style>
    :root { color-scheme: dark; --bg: #111418; --text: #e8ebee; --muted: #98a2ad; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    nav { display: flex; align-items: baseline; gap: 16px; margin-right: auto; }
    h1 { margin: 0; font-size: 20px; }
    nav a { color: var(--muted); font-size: 20px; font-weight: 600; text-decoration: none; }
    nav a:hover { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Live</a>
      <h1>Recordings</h1>
    </nav>
  </header>
  <main></main>
</body>
</html>
